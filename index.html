/* ======================= MISE EN FORME DU TEXTE (explications) =======================
   Balises lues par l'appli (riX) : [b] gras, [i] italique, [u] souligné, [p] petit, [g] grand, [tg] très grand. */
function rixHTML(s){ let h = esc(s==null?'':String(s)); const T = {b:['<b>','</b>'],i:['<i>','</i>'],u:['<u>','</u>'],p:['<span style="font-size:.85em">','</span>'],g:['<span style="font-size:1.2em">','</span>'],tg:['<span style="font-size:1.45em">','</span>']};
  for(let n=0;n<8;n++){ const h2 = h.replace(/\[(b|i|u|g|tg|p)\]([\s\S]*?)\[\/\1\]/g,(m,t,x)=>T[t][0]+x+T[t][1]); if(h2===h) break; h = h2; } return h.replace(/\[\/?(?:b|i|u|g|tg|p)\]/g,'').replace(/\n/g,'<br>'); }
function rixBarre(id){ return `<div class="row wrap rixbar" data-rix="${id}" style="gap:4px;margin:4px 0">${[['b','<b>G</b>','Gras'],['i','<i>I</i>','Italique'],['u','<u>S</u>','Souligné'],['p','<span style="font-size:11px">A</span>','Petit'],['g','<span style="font-size:16px">A</span>','Grand'],['tg','<span style="font-size:20px;line-height:1">A</span>','Très grand'],['x','⌫','Enlever la mise en forme de la sélection']].map(([t,l,ti])=>`<button type="button" class="btn sm" data-rixt="${t}" title="${ti}" aria-label="${ti}" style="min-width:38px">${l}</button>`).join('')}<span class="cnote" style="align-self:center">Sélectionnez un passage puis touchez un bouton</span></div>`; }
function rixBind(root){ (root||document).querySelectorAll('.rixbar').forEach(bar=>bar.querySelectorAll('[data-rixt]').forEach(b=>{ b.onmousedown = e=>e.preventDefault(); b.onclick = ()=>{
  const ta = document.getElementById(bar.dataset.rix); if(!ta) return; const t = b.dataset.rixt, a = ta.selectionStart, z = ta.selectionEnd, v = ta.value, sel = v.slice(a,z);
  let rep; if(t==='x') rep = sel.replace(/\[\/?(?:b|i|u|g|tg|p)\]/g,''); else { if(!sel){ toast('Sélectionnez d’abord le passage à mettre en forme.'); return; } rep = '['+t+']'+sel+'[/'+t+']'; }
  ta.value = v.slice(0,a)+rep+v.slice(z); ta.focus(); ta.setSelectionRange(a, a+rep.length); ta.dispatchEvent(new Event('input')); }; })); }
function rixApercu(ta, out){ if(!ta || !out) return; const f = ()=>{ out.innerHTML = ta.value.trim() ? '👁️ <span class="cnote">Aperçu :</span> '+rixHTML(ta.value) : ''; }; ta.addEventListener('input', f); f(); }

/* ======================= DÉSACTIVER UNE QUESTION =======================
   Correction « off: 1 » : la question disparaît chez les élèves (site élèves, site test) à leur prochaine ouverture ;
   elle reste dans l'éditeur et ici, pour la réactiver (« off: null »). Les autres corrections de la question sont gardées. */
async function qxOff(qid, on, silencieux){
  if(MODE!=='supabase' || !SB){ toast('Connectez-vous au compte administrateur pour publier.'); return false; }
  const go = async ()=>{
    try{ const {data,error} = await SB.rpc('corrections_liste'); if(!error && Array.isArray(data)) QX.corr = data; }catch(e){}
    const avant = (QX.corr||[]).find(c=>c.qid===qid && c.actif), ch = Object.assign({}, avant && avant.c && typeof avant.c==='object' ? avant.c : {}, {off: on ? 1 : null});
    try{ const {data,error} = await SB.rpc('publier_correction', {p_qid:qid, p_champs:ch, p_note:on?'Question désactivée':'Question réactivée'}); if(error || !data || !data.ok) throw error||new Error('refusée');
      try{ const X = QX.W.eval('QI['+JSON.stringify(qid)+']'); if(on) X.off = 1; else delete X.off; X.__corr = 1; }catch(e){}
      const L = QX.corr = (QX.corr||[]).filter(c=>c.qid!==qid); L.unshift({id:data.id, qid, c:ch, note:on?'Question désactivée':'Question réactivée', actif:true, t:data.t});
      audit(on?'Question désactivée':'Question réactivée', qid); if(!silencieux){ toast(on?'🙈 Question désactivée : les élèves ne la verront plus à leur prochaine ouverture.':'👁️ Question réactivée.', 4500); render(); } return true; }
    catch(e){ toast('Impossible : '+(typeof frErr==='function'?frErr(e):e.message), 6000); return false; } };
  if(!on || silencieux) return go();
  confirmModal('Désactiver cette question ?', 'Elle disparaîtra des sujets, quiz et listes des élèves (site élèves et site test) à leur prochaine ouverture. Vous pourrez la réactiver ici à tout moment.', '🙈 Désactiver', async ()=>{ closeModal(); await go(); });
}
/* ======================= MODIFIER UN SUJET ENTIER (titre, énoncés, propositions, explications) =======================
   Titre : correction « suj:<1re question du sujet> » {titre} ; questions : publier_correction comme « Corriger ». */
function qxSujets(mid){ return qxEval('(()=>{const m='+JSON.stringify(mid)+';return sujets(m).map((L,k)=>({k,n:L.length,first:L[0]||"",t:String(sujTitre(m,k)||"")}))})()') || []; }
function qxTitreCorr(first){ const c = (QX.corr||[]).find(x=>x.actif && x.qid==='suj:'+first); return c && c.c && c.c.titre ? String(c.c.titre) : ''; }
function qxSujCarte(){ const mats = qxMats(); if(!mats.length) return '';
  const mid = QX.sjm && mats.some(m=>m.id===QX.sjm) ? QX.sjm : (QX.mid || mats[0].id), L = qxSujets(mid);
  return `<div class="card" style="margin-bottom:16px"><h3 style="margin:0 0 4px">📝 Modifier un sujet entier</h3><p class="muted" style="margin:0 0 10px;font-size:13px">Titre, énoncés, propositions et explications d’un sujet, avec <b>gras</b>, <i>italique</i>, <u>souligné</u> et taille du texte. S’applique au site élèves, au site test et à l’éditeur.</p>
    <div class="row wrap" style="gap:10px"><select class="field" id="sjm" style="max-width:340px" aria-label="Cours">${mats.map(m=>`<option value="${esc(m.id)}" ${m.id===mid?'selected':''}>${esc(m.nom)}</option>`).join('')}</select>
    <select class="field" id="sjk" style="flex:1;min-width:220px" aria-label="Sujet">${L.map(s=>`<option value="${s.k}">${esc(qxTitreCorr(s.first)||s.t)} · ${s.n} question${s.n>1?'s':''}</option>`).join('')}</select>
    <button class="btn pri" id="sjgo" ${L.length?'':'disabled'}>✏️ Modifier ce sujet</button></div></div>`; }
function qxSujBind(){ const m = $('#sjm'); if(m) m.onchange = ()=>{ QX.sjm = m.value; render(); }; const g = $('#sjgo'); if(g) g.onclick = ()=>qxSujEditer($('#sjm').value, +$('#sjk').value); }
function qxSujEditer(mid, k){

  const ids = qxEval('sujets('+JSON.stringify(mid)+')['+k+']') || [], Q = ids.map(id=>qxQ(id)).filter(Boolean);

  openModal(`<button class="iconbtn x" id="mx" aria-label="Fermer">${ic('x')}</button><h2 style="margin:0 0 4px;font-family:var(--display)">📝 Modifier le sujet</h2>
    <p class="muted" style="margin:0 0 10px;font-size:13px">${esc(matName(mid))} · ${Q.length} questions · seules les parties modifiées sont publiées. Pour changer une <b>bonne réponse</b>, touchez « Réponse… » sur la question.</p>

      ${q.s?`<label class="lbl" for="sjs${i}">Situation clinique</label><textarea class="field" id="sjs${i}" rows="2">${esc(q.s)}</textarea>`:''}
      <label class="lbl" for="sjq${i}">Énoncé</label><textarea class="field" id="sjq${i}" rows="2">${esc(q.q||'')}</textarea>
      ${q.t==='qcm'&&Array.isArray(q.o)?q.o.map((o,j)=>{ const ok = (Array.isArray(q.am)&&q.am.length?q.am:[q.a]).includes(j); return `<div class="row" style="gap:6px;margin-top:4px;align-items:center"><b style="min-width:20px;${ok?'color:#16a34a':''}">${QL[j]}${ok?'✓':''}</b><input class="field" id="sjo${i}_${j}" value="${esc(o)}" style="flex:1"></div>`; }).join(''):q.t==='vf'?`<div class="cnote">Bonne réponse : <b>${q.v?'Vrai':'Faux'}</b></div>`:`<div class="cnote">Réponse attendue : <b>${esc(q.r||'')}</b></div>`}
      <label class="lbl" for="sjx${i}" style="margin-top:8px">Explication</label>${rixBarre('sjx'+i)}<textarea class="field" id="sjx${i}" rows="3">${esc(q.x||'')}</textarea><div id="sjxa${i}" style="font-size:14px;margin-top:4px"></div></div>`).join('')}
    <label class="lbl" for="sjn" style="margin-top:12px">Ce qui a été modifié (pour vous, facultatif)</label><input class="field" id="sjn" maxlength="200">
    <div class="row" style="justify-content:flex-end;margin-top:16px;position:sticky;bottom:0;background:var(--card,#fff);padding:8px 0"><button class="btn" id="mno">Annuler</button><button class="btn pri" id="mok">Publier les modifications</button></div>`);
  $('#modal').style.width = 'min(860px,calc(100% - 28px))';
  rixBind($('#modal')); Q.forEach((q,i)=>rixApercu($('#sjx'+i), $('#sjxa'+i)));

      if(!n.q) return; if(n.o && n.o.some(x=>!x)) return;
      const ch = {}; Object.keys(n).forEach(f=>{ const a = n[f]===''?null:n[f], b = q[f]==null||q[f]===''?null:q[f]; if(JSON.stringify(a)!==JSON.stringify(b)) ch[f] = a; }); if(Object.keys(ch).length) W.push([q, ch]); });

        else if((QX.corr||[]).some(c=>c.qid===qid && c.actif)){ const {error} = await SB.rpc('annuler_correction', {p_qid:qid}); if(error) err++; else n++; } }
      for(const [q, ch] of W){ b.textContent = 'Publication '+(n+1)+'/'+(W.length+(tChange?1:0))+'…';
        const avant = (QX.corr||[]).find(c=>c.qid===q.id && c.actif); if(avant && avant.c && typeof avant.c==='object') Object.keys(avant.c).forEach(f=>{ if(!(f in ch)) ch[f] = avant.c[f]; });
        try{ const {data,error} = await SB.rpc('publier_correction', {p_qid:q.id, p_champs:ch, p_note:note}); if(error || !data || !data.ok){ err++; continue; } n++;
          try{ const X = QX.W.eval('QI['+JSON.stringify(q.id)+']'); Object.keys(ch).forEach(f=>{ if(ch[f]===null) delete X[f]; else X[f] = JSON.parse(JSON.stringify(ch[f])); }); X.__corr = 1; }catch(e){} }catch(e){ err++; } }

/* ======================= CONTRIBUTEURS & MÉDAILLES =======================
   SQL : supabase/contributeurs/1_contributeurs.sql. L'élève reçoit la demande sur son téléphone (Oui / Non) ;
   son nom n'apparaît (tableau d'honneur, « Sources photos fournies par … ») qu'après son Oui. */
const CT = { etat:'', L:[], credits:[], reg:{actif:true, tableau:true, credits:true}, q:'' };
const CT_MED = {or:'🥇 Or', argent:'🥈 Argent', bronze:'🥉 Bronze', merci:'🎖️ Mérite'};
async function ctCharger(){ if(MODE!=='supabase' || !SB){ CT.etat = 'local'; return; } CT.etat = 'charge';
  try{ const {data,error} = await SB.rpc('contrib_liste'); if(error) throw error; CT.L = data.contributeurs||[]; CT.credits = data.credits||[]; CT.reg = Object.assign({actif:true, tableau:true, credits:true}, data.reglages||{}); CT.etat = 'ok'; }
  catch(e){ CT.etat = /contrib_liste|function|schema cache/i.test(String(e.message||e)) ? 'sql' : 'err'; }
  if(page==='contrib') render(); }
function ctCandidats(){ const G = {};
  DB.reports.filter(r=>r.appareil).forEach(r=>{ const g = G[r.appareil] = G[r.appareil] || {a:r.appareil, nom:'', sig:0, ph:0, cor:0, qs:new Set()}; g.sig++; if(r.photo) g.ph++; if(sigJuste(r)) g.cor++; if(sq(r)) g.qs.add(sq(r));
    if(!g.nom){ const p = api.get('profiles', r.user_id), pn = nomDe(r.appareil); g.nom = p ? fullName(p) : pn ? pn.prenom : r.eleve ? String(r.eleve).replace(/\s*\(sans compte\)\s*/,'').trim() : ''; } });
  nomsEleves().forEach(x=>{ if(!G[x.a]) G[x.a] = {a:x.a, nom:x.prenom, sig:0, ph:0, cor:0, qs:new Set()}; });
  CT.L.forEach(c=>{ if(!G[c.appareil]) G[c.appareil] = {a:c.appareil, nom:c.nom, sig:0, ph:0, cor:0, qs:new Set()}; });
  return Object.values(G).map(g=>Object.assign(g, {c:CT.L.find(c=>c.appareil===g.a)||null, nq:g.qs.size})).sort((x,y)=>(!!y.c-!!x.c)||(y.ph-x.ph)||(y.sig-x.sig)||String(x.nom).localeCompare(String(y.nom))); }
const ctStat = c => !c ? '' : c.statut==='accepte' ? '<span class="pill ok">✅ A dit Oui</span>' : c.statut==='refuse' ? '<span class="pill" style="background:#fdecec;color:#b42318">❌ A dit Non</span>' : '<span class="pill" style="background:#fff7e0;color:#8a5a00">⏳ Demande envoyée</span>';
VIEWS.contrib = ()=>{
  if(!CT.etat) ctCharger();

  if(CT.etat==='local') return head + '<div class="card"><p class="muted" style="margin:0">Connectez-vous au compte administrateur (Supabase) pour gérer les contributeurs.</p></div>';
  if(CT.etat==='sql') return head + '<div class="card"><b>Une étape dans Supabase :</b><p class="muted">Collez le fichier <b>supabase/contributeurs/1_contributeurs.sql</b> dans Supabase (SQL Editor → New query → coller → Run), puis rechargez cette page.</p></div>';
  if(CT.etat!=='ok') return head + `<div class="card"><p class="muted" style="margin:0">${CT.etat==='err'?'Chargement impossible : vérifiez la connexion. <button class="btn sm" id="ctre">Réessayer</button>':'⏳ Chargement…'}</p></div>`;
  const R = CT.reg, sw = (k,l,d)=>`<label class="row" style="gap:10px;padding:8px 0;cursor:pointer;align-items:flex-start"><input type="checkbox" data-ctreg="${k}" ${R[k]!==false?'checked':''} style="width:20px;height:20px;margin-top:2px"><span><b>${l}</b><br><span class="cnote">${d}</span></span></label>`;
  const qq = nrmTxt(CT.q||''), tri = CT.tri||'defaut', C = ctCandidats().filter(g=>!qq || nrmTxt(g.nom+' '+g.a).includes(qq)).filter(g=>CT.st==='oui'?g.c&&g.c.statut==='accepte':CT.st==='att'?g.c&&g.c.statut==='demande':CT.st==='sans'?!g.c:true);
  if(tri!=='defaut') C.sort((a,b)=>tri==='nom'?String(a.nom).localeCompare(String(b.nom),'fr'):(({sig:x=>x.sig,ph:x=>x.ph,ok:x=>x.cor})[tri](b)-({sig:x=>x.sig,ph:x=>x.ph,ok:x=>x.cor})[tri](a)));
  const lig = g=>{ const c = g.c; return `<div class="row wrap" style="gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center"><div style="flex:1;min-width:220px"><b>${esc(g.nom||'(sans nom)')}</b> ${ctStat(c)} ${c&&c.medaille?`<span class="pill">${CT_MED[c.medaille]||''}</span>`:''}${c&&!c.visible?' <span class="pill">masqué</span>':''}
      <div class="cnote">${g.sig} signalement${g.sig>1?'s':''} · ${g.ph} photo${g.ph>1?'s':''} · ${g.cor} juste${g.cor>1?'s':''}${c?` · crédité sur ${+c.nb_credits||0} question${(+c.nb_credits||0)>1?'s':''}`:''}${c&&c.felicitation&&!c.felicitation_vue?' · 🎉 félicitations pas encore lues':''}</div></div>

      let nd = 0; try{ nd = (QX.W.riDoublons ? QX.W.riDoublons(qid) : []).length; }catch(e){}
      audit('Question corrigée depuis le tableau de bord', matName(q0.m)+' · '+qid+(nd?' (+ '+nd+' identique'+(nd>1?'s':'')+')':'')); fermer();
      toast('✅ Correction publiée : les téléphones la recevront à leur prochaine ouverture'+(nd?' · '+nd+' question'+(nd>1?'s':'')+' identique'+(nd>1?'s':'')+' dans d’autres sujets corrigée'+(nd>1?'s':'')+' aussi':'')+(nr?' · '+nr+' élève'+(nr>1?'s':'')+' prévenu'+(nr>1?'s':''):'')+'.', 5000);
      QX.suspects = null; qxSuspects(true); render();
    }catch(e){ b.disabled = false; b.textContent = 'Publier la correction'; toast(/2_images_explications/.test(String(e.message||e)) ? e.message : /publier_correction|function|schema cache/i.test(String(e.message||e)) ? 'Collez d’abord supabase/outils/1_corrections_choix_bilan.sql dans Supabase.' : 'Publication impossible : '+(typeof frErr==='function'?frErr(e):e.message), 6000); }
  };
}


/* ---------- 📊 bilan de la semaine (fonction SQL bilan_semaine) : carte sur la vue d’ensemble, fenêtre le lundi, texte pour WhatsApp ---------- */
const BIL = {d:null, err:'', charge:false};
async function bilanCharger(){

  catch(e){ BIL.err = /bilan_semaine|function|schema cache/i.test(String(e.message||e)) ? 'sql' : 'reseau'; }

}
function bilanTexte(){ const b = BIL.d; if(!b) return '';
  const L = [`📊 Révision INFAS · bilan de la semaine (${dfr(b.du,{day:'numeric',month:'short'})} → ${dfr(b.au,{day:'numeric',month:'short'})})`,
    `👥 Nouveaux inscrits : ${fmt((+b.nouveaux_mail||0)+(+b.nouveaux_nom||0))} (${fmt(+b.nouveaux_mail||0)} par e-mail · ${fmt(+b.nouveaux_nom||0)} avec le nom)`,
    `📱 Élèves actifs : ${fmt(+b.actifs||0)} téléphones`, `⭐ Premium actifs : ${fmt(+b.premium||0)}`, `📝 Quiz terminés : ${fmt(+b.quiz||0)}`,
    `🚩 Signalements : ${fmt(+b.signalements_semaine||0)} cette semaine · ${fmt(+b.signalements_attente||0)} en attente`];
  if((b.matieres||[]).length) L.push('📚 Matières les plus travaillées : '+b.matieres.slice(0,5).map(m=>`${matName(m.mat)} (${fmt(+m.n)})`).join(', '));
  if((b.ratees||[]).length) L.push('❌ Questions les plus ratées : '+b.ratees.slice(0,5).map(q=>`${q.qid} (${Math.round(q.taux*100)} % d’erreurs)`).join(', '));
  return L.join('\n'); }
function bilanCard(){
  if(MODE!=='supabase') return '';

const REP_MODELES = {corrigee:'Merci pour ton signalement ! La question a été corrigée : la bonne réponse est maintenant ',
  eclaircie:'Merci pour ton signalement ! Après vérification, la réponse proposée est juste : '};
function repondreModal(id){
  const RR = (Array.isArray(id) ? id : [id]).map(i=>api.get('reports', i)).filter(Boolean), r = RR[0]; if(!r) return; let type = r.reponse_type || (r.statut==='corrige' ? 'corrigee' : 'eclaircie');
  const draw = ()=>{ $('#rtype').innerHTML = [['corrigee','✅ Réponse corrigée','La question avait une erreur, elle est corrigée'],['eclaircie','💡 Éclaircir sa lanterne','La réponse était juste : expliquer pourquoi']].map(([v,l,d])=>`<button type="button" class="rtyp ${type===v?'on':''}" data-rt="${v}" aria-pressed="${type===v}" style="flex:1;min-width:180px;text-align:left;padding:12px;border-radius:14px;border:2px solid ${type===v?'var(--violet)':'var(--line)'};background:${type===v?'color-mix(in srgb,var(--violet) 9%,transparent)':'transparent'};cursor:pointer;color:inherit;font:inherit"><b>${l}</b><br><span class="muted" style="font-size:13px">${d}</span></button>`).join('');

  openModal(`<h2 style="margin:0 0 6px;font-family:var(--display)">✉️ Répondre à l’élève</h2>
    <p class="muted" style="margin:0 0 8px;font-size:13.5px"><b>${esc(matName(r.mat))}</b> · ${esc(String(r.question||'')).slice(0,200)}</p>
    ${RR.length>1?`<div class="cnote" style="margin-bottom:10px">💬 ${RR.length} élèves ont signalé cette question. Une seule réponse leur sera envoyée à tous.</div>`:`<div class="cnote" style="margin-bottom:10px">💬 Son message : « ${esc(String(r.message||'')).slice(0,240)} »</div>`}
    <div class="row wrap" id="rtype" style="gap:10px"></div>
    <label class="lbl" for="rtxt" style="margin-top:12px">Votre message (il s’affichera sur son téléphone, à l’accueil, à sa prochaine ouverture de l’appli)</label>
    <textarea class="field" id="rtxt" rows="5" maxlength="2000" style="width:100%;resize:vertical">${esc(r.reponse || REP_MODELES[type])}</textarea>
    <p class="cnote" style="margin:6px 0 0">${RR.length>1?`Seuls les ${RR.length} élèves qui ont signalé cette question la recevront.`:'Seul l’élève qui a envoyé ce signalement le recevra.'}</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" id="mno">Annuler</button><button class="btn pri" id="mok">Envoyer la réponse</button></div>`);
  draw(); $('#mno').onclick = closeModal;
  $('#mok').onclick = async ()=>{ const txt = $('#rtxt').value.trim(); if(txt.length<2){ toast('Écrivez votre réponse.'); return; }
    const b = $('#mok'); b.disabled = true; b.textContent = 'Envoi…';
    try{
      for(const x of RR){
        if(MODE==='supabase' && SB){ const {data, error} = await SB.rpc('repondre_signalement', {p_id:String(x.id), p_type:type, p_texte:txt}); if(error) throw error; if(!data || !data.ok) throw new Error(data && data.raison==='introuvable' ? 'Signalement introuvable dans la base.' : 'Réponse refusée.'); }

/* ---------- alertes en direct : nouveaux signalements (toutes les 45 s, tableau de bord ouvert) ---------- */
let SIG_TITRE = document.title, sigNonVus = 0;
function bip(){ try{ const A=new (window.AudioContext||window.webkitAudioContext)(), o=A.createOscillator(), g=A.createGain(); o.connect(g); g.connect(A.destination); o.frequency.value=880; g.gain.setValueAtTime(.0001,A.currentTime); g.gain.exponentialRampToValueAtTime(.25,A.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.5); o.start(); o.stop(A.currentTime+.55); }catch(e){} }
async function veilleSignalements(){
  if(MODE!=='supabase' || !SB || !DB) return;
  try{
    const depuis = DB.reports.reduce((m,r)=>r.date>m?r.date:m, '1970-01-01T00:00:00Z');
    const {data, error} = await SB.from('reports').select('*').gt('created_at', depuis).order('created_at',{ascending:true}).limit(50);
    if(error || !data || !data.length) return;
    const m = MAP.find(x=>x.k==='reports'), neufs = data.filter(r=>!DB.reports.some(x=>x.id===r.id)).map(m.from);
    if(!neufs.length) return;
    neufs.forEach(o=>{ DB.reports.push(o); (SNAP.reports = SNAP.reports || new Map()).set(o.id, JSON.stringify(m.to(o))); });
    sigNonVus += neufs.length; document.title = `(${sigNonVus}) 🚩 ${SIG_TITRE}`;
    const r = neufs[neufs.length-1], t = `🚩 Nouveau signalement · ${matName(r.mat)}`;
    toast(t + (neufs.length>1?` (+${neufs.length-1})`:'')); bip();

    if(page==='signalements') render(); else renderNav();
  }catch(e){}
}

    const L=[]; (c.rubriques||[]).forEach(rb=>(rb.matieres||[]).forEach(m=>{ const S=Array.isArray(m.sujets)?m.sujets.map((x,k)=>({k,t:x[0],n:x[1]})):Array.from({length:m.nsuj||0},(x,k)=>({k,t:'',n:0})); if(S.some(s=>s.n>0||!s.t)) L.push({rub:prettyRub(rb.nom), id:m.id, nom:m.court||m.nom, titres:Array.isArray(m.sujets), sujets:S, doc:m.accueil?(m.rev||('DOCUMENT DE REVISION '+(m.court||m.nom))):''}); }));

function cpOptions(m,f){ const L=m.sujets.filter(s=>s.n>0||!s.t), opt=(s,t)=>`<option value="${s.k}" ${+f.k===s.k?'selected':''}>${esc(t)}${s.n?' · '+s.n+' q.':''}</option>`;

      </tbody></table></div></div>

      ${DB.goals.map(g=>`<div class="row wrap" style="padding:8px 0;border-top:1px solid var(--line)"><input class="field" style="flex:2;min-width:150px" data-goal="${g.id}" data-k="titre" value="${esc(g.titre)}" aria-label="Titre"><input class="field" type="number" min="1" style="width:90px" data-goal="${g.id}" data-k="cible" value="${g.cible}" aria-label="Cible"><input class="field" type="date" style="width:160px" data-goal="${g.id}" data-k="echeance" value="${g.echeance}" aria-label="Échéance"></div>`).join('')}</div>
  </div>
  ${payCard()}
  <div class="grid accgrid" style="margin-top:18px">
    <div class="card"><div class="cardhead"><div class="grow"><h3>Données</h3><p class="sub">${MODE==='supabase'?'Source actuelle : votre projet Supabase':'Source actuelle : ce navigateur (localStorage)'}</p></div></div>
      <div class="kv"><span>Source</span><b>${MODE==='supabase'?'Supabase':'Locale (ce navigateur)'}</b><span>Dernier enregistrement</span><b>${DB.meta.savedAt?dfr(DB.meta.savedAt)+' à '+hfr(DB.meta.savedAt):'—'}</b><span>Contenu</span><b>${fmt(DB.profiles.length)} élèves · ${DB.entitlements.length} pass · ${Object.keys(DB.access.regles).length} règles</b></div>
      <div class="row wrap"><button class="btn" id="expall">${ic('dl')}Sauvegarder toutes les données</button><button class="btn" id="impall">${ic('ul')}Restaurer une sauvegarde</button></div>
      <div class="row wrap" style="margin-top:10px"><button class="btn" id="reseed">Régénérer les données fictives</button><button class="btn danger" id="wipe">Vider les élèves de test</button></div></div>
    <div class="card"><div class="cardhead"><div class="grow"><h3>Brancher le portail élève</h3><p class="sub">Fonction à ajouter au portail pour lire les règles exportées</p></div><button class="btn sm" id="copysn">Copier</button></div>
      <pre class="code">${esc(snippet)}</pre></div>
  </div>
  <div class="card" style="margin-top:18px"><div class="cardhead"><div class="grow"><h3>Liste des cours</h3><p class="sub">Relue dans le portail publié à chaque ouverture du tableau de bord</p></div><button class="btn sm" id="catreload">Recharger</button></div>
    <div class="kv"><span>Source</span><b>${CAT_INFO.source==='portail'?'Portail publié':CAT_INFO.source==='cache'?'Dernière liste reçue (hors ligne)':'Liste intégrée au tableau de bord'}</b><span>Publiée le</span><b>${CAT_INFO.genere?dfr(CAT_INFO.genere)+' à '+hfr(CAT_INFO.genere):'—'}</b><span>Contenu</span><b>${CATALOGUE.length} rubriques · ${CATALOGUE.reduce((a,r)=>a+r.matieres.length,0)} cours</b>${CAT_INFO.erreur?`<span>Dernier essai</span><b style="color:var(--red)">${esc(CAT_INFO.erreur)}</b>`:''}</div>
    <label class="lbl" for="porturl">Adresse du portail publié</label><input class="field" id="porturl" value="${esc(portailUrl())}">
    <label class="lbl" for="edurl">Adresse de l’éditeur en ligne (bouton « Corriger dans l’éditeur »)</label><input class="field" id="edurl" value="${esc(editeurUrl())}">
  </div>
  ${supabaseCard()}
  <div class="card" style="margin-top:18px"><div class="cardhead"><div class="grow"><h3>Journal des actions</h3><p class="sub">Chaque modification faite dans ce tableau de bord</p></div></div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Date</th><th>Action</th><th>Sur</th></tr></thead><tbody>
    ${DB.audit_log.slice(0,40).map(a=>`<tr><td style="white-space:nowrap">${dfr(a.date,{day:'numeric',month:'short'})} · ${hfr(a.date)}</td><td>${esc(a.action)}</td><td>${esc(a.cible)}</td></tr>`).join('')}
    </tbody></table></div></div>`;
  AFTER.reglages.snippet = snippet;
};
AFTER.reglages = ()=>{
  document.querySelectorAll('[data-plan]').forEach(el=>el.onchange=()=>{ const p=DB.plans.find(x=>x.id===el.dataset.plan), k=el.dataset.k; p[k]= k==='actif'?el.checked : k==='nom'?el.value : Math.max(0,+el.value||0); persist(); audit('Pass modifié', p.nom); toast('Pass enregistré.'); });
  document.querySelectorAll('[data-goal]').forEach(el=>el.onchange=()=>{ const g=DB.goals.find(x=>x.id===el.dataset.goal), k=el.dataset.k; g[k]= k==='cible'?Math.max(1,+el.value||1):el.value; persist(); toast('Objectif enregistré.'); });
  $('#expall').onclick=()=>{ download(`sauvegarde-admin-${new Date().toISOString().slice(0,10)}.json`, DB); toast('Sauvegarde téléchargée.'); };
  $('#impall').onclick=()=>pickFile(obj=>{ if(!obj||!Array.isArray(obj.profiles)||!obj.access){ toast('Ce fichier n’est pas une sauvegarde du tableau de bord.'); return; } DB=normalizeIds(obj); persist(); audit('Sauvegarde restaurée','—'); toast('Sauvegarde restaurée.'); render(); });
  $('#reseed').onclick=()=>confirmModal('Régénérer les données fictives ?',MODE==='supabase'?'Les élèves, règles et annonces de votre base Supabase seront remplacés par le jeu de test de départ.':'Vos élèves, règles et annonces actuels seront remplacés par le jeu de test de départ.','Régénérer',()=>{ DB=seed(); persist(); toast('Données fictives régénérées.'); render(); });
  $('#wipe').onclick=()=>confirmModal('Vider les élèves de test ?','Les élèves de test (sans compte), leurs pass et les statistiques fictives seront effacés. Les vrais comptes élèves, vos règles d’accès, pass et annonces sont conservés.','Vider',()=>{ const garde=new Set(DB.profiles.filter(p=>p.auth_id).map(p=>p.id)); DB.profiles=DB.profiles.filter(p=>garde.has(p.id)); DB.entitlements=DB.entitlements.filter(e=>garde.has(e.user_id)); DB.reports=DB.reports.filter(r=>!r.user_id||garde.has(r.user_id)); DB.stats.daily=DB.stats.daily.map(d=>({...d,actifs:0,quiz:0,inscriptions:0})); Object.keys(DB.stats.usageMatieres).forEach(k=>DB.stats.usageMatieres[k]=0); DB.stats.notions=[]; DB.meta.demo=false; persist(); audit('Données de test vidées','—'); toast('Élèves de test effacés.'); render(); });
  bindSupabaseCard();
  bindPayCard();
  $('#catreload').onclick = async ()=>{ toast('Lecture de la liste des cours…'); const ok = await loadCatalogue(); render(); toast(ok?'Liste des cours à jour.':'Liste non mise à jour : '+CAT_INFO.erreur); };
  $('#edurl').onchange = e=>{ const v=e.target.value.trim(); setCfg(Object.assign(getCfg(),{editeur:v||EDITEUR_DEFAUT})); toast('Adresse de l’éditeur enregistrée.'); };
  $('#porturl').onchange = e=>{ const v=e.target.value.trim(); setCfg(Object.assign(getCfg(),{portail:v||PORTAIL_DEFAUT})); toast('Adresse enregistrée.'); };
  $('#copysn').onclick=()=>{ const t=AFTER.reglages.snippet; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Code copié.')).catch(()=>toast('Copie impossible : sélectionnez le code à la main.')); };
};

/* =========================================================
   15. CONNEXION SUPABASE (réglages, connexion admin)
   ========================================================= */
function supabaseCard(){
  const c = getCfg();
  if(MODE==='supabase') return `
  <div class="card" style="margin-top:18px"><div class="cardhead"><div class="grow"><h3>Supabase</h3><p class="sub">Connecté à ${esc(c.url||'')}</p></div><span class="pill ok">Connecté</span></div>
    <div class="kv"><span>Compte admin</span><b>${esc(SB_EMAIL||'—')}</b><span>État</span><b>${syncState==='error'?'Erreur : '+esc(syncMsg):syncState==='pending'?'Enregistrement en cours':'À jour'}</b></div>
    <div class="row wrap">
      <button class="btn" id="sbreload">Recharger depuis Supabase</button>
      <button class="btn" id="sbpush">${ic('ul')}Envoyer les données locales vers Supabase</button>
      <button class="btn" id="sblocal">Revenir aux données locales</button>
      <button class="btn danger" id="sbout">Se déconnecter</button>
    </div>
    <p class="sub" style="margin-top:10px">« Envoyer les données locales » ajoute à la base les élèves, pass, règles et annonces enregistrés dans ce navigateur (rien n’est supprimé dans Supabase).</p>
  </div>`;
  return `
  <div class="card" style="margin-top:18px"><div class="cardhead"><div class="grow"><h3>Brancher Supabase</h3><p class="sub">Étape 2 : collez l’URL et la clé publique de votre projet (réglages API de Supabase). N’utilisez jamais la clé secrète ou service_role.</p></div></div>
    <div class="grid accgrid" style="gap:12px">
      <div><label class="lbl" for="sburl">URL du projet</label><input class="field" id="sburl" placeholder="https://xxxxxxxx.supabase.co" value="${esc(c.url||'')}" autocomplete="off"></div>
      <div><label class="lbl" for="sbkey">Clé publique (publishable ou anon)</label><input class="field" id="sbkey" placeholder="sb_publishable_… ou eyJ…" value="${esc(c.key||'')}" autocomplete="off"></div>
    </div>
    <div class="row wrap" style="margin-top:14px"><button class="btn" id="sbtest">Tester la connexion</button><button class="btn pri" id="sbuse">Utiliser Supabase</button></div>
    <div id="sbmsg"></div>
  </div>`;
}
function payCard(){
  const c = DB.paiementCfg || PAY_DEFAUT();
  return `<div class="card" style="margin-top:18px"><div class="cardhead"><div class="grow"><h3>Paiement Mobile Money</h3><p class="sub">Numéros affichés aux élèves dans l’écran « Payer ». Laisse vide un moyen que tu n’utilises pas.</p></div>
    <label class="row" style="gap:8px;font-weight:600;cursor:pointer"><input type="checkbox" id="payon" ${c.actif?'checked':''}> Paiement ouvert</label></div>
    <div class="grid accgrid" style="gap:12px">
      ${Object.keys(OPS).map(k=>`<div><label class="lbl" for="pn-${k}"><span class="dot" style="background:${OPS[k][1]}"></span> ${OPS[k][0]}</label><input class="field" id="pn-${k}" data-num="${k}" inputmode="tel" placeholder="Ex. 07 00 00 00 00" value="${esc(c.numeros[k]||'')}"></div>`).join('')}
      <div><label class="lbl" for="pnom">Nom affiché pour le bénéficiaire</label><input class="field" id="pnom" maxlength="60" placeholder="Ex. Daniel N." value="${esc(c.nom||'')}"></div>
      <div><label class="lbl" for="pcons">Consigne (facultatif)</label><input class="field" id="pcons" maxlength="160" placeholder="Ex. Validation dans la journée" value="${esc(c.consigne||'')}"></div>
      <div><label class="lbl" for="pcontact">💬 WhatsApp de l’administrateur (les élèves vous écrivent pour recevoir leur code)</label><input class="field" id="pcontact" inputmode="tel" placeholder="Ex. 07 00 00 00 00" value="${esc(c.contact||'')}"></div>
    </div>
    <p class="sub" style="margin-top:10px">${c.actif?'✅ Les élèves connectés voient le bouton « Payer par Mobile Money ».':'Le paiement est fermé : les élèves voient « Le paiement arrive bientôt ».'} Les changements arrivent dans l’appli à sa prochaine ouverture.</p></div>`;
}
function bindPayCard(){
  const save = (msg)=>{ DB.paiementCfg = DB.paiementCfg || PAY_DEFAUT(); persist(); audit('Réglages de paiement modifiés', msg); toast('Réglages de paiement enregistrés.'); };
  document.querySelectorAll('[data-num]').forEach(el=>el.onchange=()=>{ const v=el.value.trim(); if(v && v.replace(/[^0-9]/g,'').length<8){ toast('Numéro trop court.'); return; } DB.paiementCfg.numeros[el.dataset.num]=v; save(OPS[el.dataset.num][0]); render(); });
  $('#pnom').onchange=e=>{ DB.paiementCfg.nom=e.target.value.trim(); save('Bénéficiaire'); };
  $('#pcons').onchange=e=>{ DB.paiementCfg.consigne=e.target.value.trim(); save('Consigne'); };
  $('#pcontact').onchange=e=>{ const v=e.target.value.trim(); if(v && v.replace(/[^0-9]/g,'').length<8){ toast('Numéro trop court.'); return; } DB.paiementCfg.contact=v; save('WhatsApp de l’administrateur'); };
  $('#payon').onchange=e=>{ const c=DB.paiementCfg; if(e.target.checked && !Object.values(c.numeros).some(Boolean)){ e.target.checked=false; toast('Renseigne au moins un numéro avant d’ouvrir le paiement.'); return; } c.actif=e.target.checked; save(c.actif?'Paiement ouvert':'Paiement fermé'); render(); };
}
function sbMsg(kind, text){ const el=$('#sbmsg'); if(el) el.innerHTML = `<div class="msg ${kind}">${esc(text)}</div>`; }
function readCfgFields(){ return {url:($('#sburl').value||'').trim(), key:($('#sbkey').value||'').trim()}; }
function bindSupabaseCard(){
  if(MODE==='supabase'){
    $('#sbreload').onclick = async ()=>{ try{ toast('Chargement…'); DB = await SupabaseSource.load(); await loadReal(); render(); toast('Données rechargées depuis Supabase.'); }catch(e){ toast(frErr(e)); } };
    $('#sbpush').onclick = pushLocalToSupabase;
    $('#sblocal').onclick = ()=>confirmModal('Revenir aux données locales ?','Le tableau de bord affichera de nouveau les données de ce navigateur. Vos données Supabase restent intactes.','Revenir au local',()=>{ setCfg(Object.assign(getCfg(),{mode:'local'})); location.reload(); });
    $('#sbout').onclick = signOut;
    return;
  }
  $('#sbtest').onclick = async ()=>{
    const c = readCfgFields();
    if(!/^https:\/\/.+/.test(c.url)) return sbMsg('bad','L’URL doit commencer par https:// (ex. https://abcd.supabase.co).');
    const kp = keyProblem(c.key); if(kp) return sbMsg('bad', kp);
    sbMsg('ok','Test en cours…');
    try{
      const cl = await sbClient(c);
      const {error} = await cl.from('plans').select('id').limit(1);
      if(error) throw error;
      sbMsg('ok','Connexion réussie : les tables Révision INFAS sont en place.');
    }catch(e){ sbMsg('bad', frErr(e)); }
  };
  $('#sbuse').onclick = ()=>{
    const c = readCfgFields();
    if(!/^https:\/\/.+/.test(c.url)) return sbMsg('bad','L’URL doit commencer par https:// (ex. https://abcd.supabase.co).');
    const kp = keyProblem(c.key); if(kp) return sbMsg('bad', kp);
    setCfg({url:c.url, key:c.key, mode:'supabase'});
    location.reload();
  };
}
async function signOut(){ try{ if(SB) await SB.auth.signOut(); }catch(e){} location.reload(); }
async function pushLocalToSupabase(){
  const local = LocalSource.load();
  if(!local || !local.profiles){ toast('Aucune donnée locale à envoyer.'); return; }
  normalizeIds(local); LocalSource.save(local);
  confirmModal('Envoyer les données locales ?', `${local.profiles.length} élèves, ${local.entitlements.length} pass, ${Object.keys(local.access.regles).length} règles et ${local.announcements.length} annonces seront ajoutés à Supabase. Les éléments déjà présents avec le même identifiant seront mis à jour.`, 'Envoyer vers Supabase', async ()=>{
    const merge = (a,b)=>{ const ids=new Set(b.map(x=>x.id)); return a.filter(x=>!ids.has(x.id)).concat(b); };
    ['profiles','entitlements','reports','announcements','plans'].forEach(k=>{ DB[k] = merge(DB[k], local[k]||[]); });
    DB.access.regles = Object.assign({}, DB.access.regles, local.access.regles);
    DB.access.defaut = local.access.defaut; DB.access.version = Math.max(DB.access.version, local.access.version)+1; DB.access.misAJour = new Date().toISOString();
    if(local.goals) DB.goals = local.goals;
    if(local.stats) DB.stats = local.stats;
    DB.meta.demo = DB.meta.demo || !!local.meta.demo;
    audit('Données locales envoyées vers Supabase', `${local.profiles.length} élèves`);
    render(); toast('Envoi en cours…');
  });
}

/* écrans plein cadre (chargement, connexion) */
function lockedView(html){ document.body.classList.add('locked'); $('#sync').style.display='none'; $('#view').innerHTML = `<div class="login card">${html}</div>`; $('#crumb').textContent='Connexion'; renderPhase(); paintSync(); }
function showLoading(text){ lockedView(`<h1>Révision INFAS</h1><p class="muted">${esc(text)}</p>`); }
function showLogin(err=''){
  lockedView(`<h1>Connexion administrateur</h1><p class="muted" style="margin:0">Projet Supabase : ${esc(getCfg().url||'')}</p>
    <form id="loginf" autocomplete="on">
      <label class="lbl" for="lemail">E-mail</label><input class="field" id="lemail" type="email" autocomplete="username" required>
      <label class="lbl" for="lpass">Mot de passe</label><input class="field" id="lpass" type="password" autocomplete="current-password" required>
      <button class="btn pri" style="width:100%;justify-content:center;margin-top:16px" type="submit">Se connecter</button>
    </form>
    <div id="lmsg">${err?`<div class="msg bad">${esc(err)}</div>`:''}</div>
    <button class="btn sm" style="margin-top:16px" id="backlocal">Revenir aux données locales</button>`);
  $('#backlocal').onclick = ()=>{ setCfg(Object.assign(getCfg(),{mode:'local'})); location.reload(); };
  $('#loginf').onsubmit = async e=>{
    e.preventDefault();
    $('#lmsg').innerHTML = '<div class="msg ok">Connexion…</div>';
    const {error} = await SB.auth.signInWithPassword({email:$('#lemail').value.trim(), password:$('#lpass').value});
    if(error){ $('#lmsg').innerHTML = `<div class="msg bad">${esc(frErr(error))}</div>`; return; }
    enterSupabase();
  };
  const f = $('#lemail'); if(f) f.focus();
}
function showProblem(title, text, sql=''){
  lockedView(`<h1>${esc(title)}</h1><p class="muted">${text}</p>${sql?`<pre class="code">${esc(sql)}</pre>`:''}
    <div class="row wrap" style="margin-top:14px"><button class="btn" id="retry">Réessayer</button><button class="btn" id="backlocal">Revenir aux données locales</button>${SB?'<button class="btn danger" id="lout">Se déconnecter</button>':''}</div>`);
  $('#retry').onclick = ()=>location.reload();
  $('#backlocal').onclick = ()=>{ setCfg(Object.assign(getCfg(),{mode:'local'})); location.reload(); };
  if($('#lout')) $('#lout').onclick = signOut;
}
async function enterSupabase(){
  showLoading('Chargement des données depuis Supabase…');
  try{
    const {data:{session}} = await SB.auth.getSession();
    if(!session) return showLogin();
    SB_EMAIL = session.user.email || '';
    const {data:isAdm, error} = await SB.rpc('is_admin');
    if(error) throw error;
    if(!isAdm) return showProblem('Compte non administrateur', `Le compte ${esc(SB_EMAIL)} est connecté, mais il n’a pas le rôle admin. Lancez ce bloc dans l’éditeur SQL de Supabase, puis réessayez :`,
      `insert into public.profiles (auth_id, prenom, nom, role)\nselect id, 'Daniel', 'Noufe', 'admin' from auth.users where email = '${SB_EMAIL}'\non conflict (auth_id) do update set role = 'admin', statut = 'actif';`);
    DB = await SupabaseSource.load();
    MODE = 'supabase'; source = SupabaseSource; setSync('ok'); await loadReal();
    document.body.classList.remove('locked'); $('#sync').style.display='';
    $('#crumb').textContent = PAGES.find(x=>x.id===page).nom;
    render();
  }catch(e){ showProblem('Connexion impossible', esc(frErr(e))); }
}

/* =========================================================
   16. DÉMARRAGE
   ========================================================= */
$('#sync').onclick = ()=>{ if(!DB) return; if(MODE==='supabase' && syncState==='error') runSync(); else go('reglages'); };
$('#me').onclick = ()=>{
  openModal(`<button class="iconbtn x" id="mx" aria-label="Fermer">${ic('x')}</button><h2 style="margin:0 0 6px;font-family:var(--display)">Mon compte</h2>
    <div class="kv"><span>Nom</span><b>${esc(ADMIN_NAME)}</b><span>Source</span><b>${MODE==='supabase'?'Supabase':'Ce navigateur'}</b>${SB_EMAIL?`<span>E-mail</span><b>${esc(SB_EMAIL)}</b>`:''}</div>
    <div class="row wrap"><button class="btn" id="tosettings">Réglages</button>${MODE==='supabase'?'<button class="btn danger" id="mout">Se déconnecter</button>':''}</div>`);
  $('#mx').onclick = closeModal; $('#tosettings').onclick = ()=>{ closeModal(); go('reglages'); };
  if($('#mout')) $('#mout').onclick = signOut;
};
function bootLocal(){
  MODE = 'local'; source = LocalSource;
  DB = LocalSource.load();
  if(!DB || !DB.profiles || !DB.access){ DB = seed(); }
  else normalizeIds(DB);
  if(!Array.isArray(DB.payments)) DB.payments = [];
  if(!DB.paiementCfg) DB.paiementCfg = PAY_DEFAUT();
  persist();
  render();
}
(async function boot(){
  try{ const t=localStorage.getItem('rinfas_theme'); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  const h = (location.hash||'').slice(1); if(PAGES.some(p=>p.id===h)) page=h;
  $('#crumb').textContent = PAGES.find(x=>x.id===page).nom;
  loadCatalogueCache();
  loadCatalogue().then(ok=>{ if(ok && DB) render(); });
  const cfg = getCfg();
  if(cfg.mode==='supabase' && cfg.url && cfg.key){
    showLoading('Connexion à Supabase…');
    try{ SB = await sbClient(cfg); }
    catch(e){ return showProblem('Connexion impossible', esc(frErr(e))); }
    return enterSupabase();
  }
  bootLocal();
})();
</script>
