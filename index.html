<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin INFAS">
<title>Révision INFAS · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F4FB; --card:#FFFFFF; --ink:#1F1A3D; --muted:#6E6889; --line:#E9E6F4; --soft:#F1EEFB;
  --violet:#6C3BF5; --violet-ink:#4A22C9; --teal:#17B3A3; --rose:#E25DB8; --amber:#E89A2C; --red:#E04848; --green:#1E9E6A;
  --free:#17B3A3; --prem:#6C3BF5; --hidden:#9A95AE;
  --shadow:0 1px 2px rgba(31,26,61,.04),0 8px 24px -12px rgba(31,26,61,.12);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --paper:#13111F; --card:#1C1930; --ink:#EEEAFB; --muted:#A39DBD; --line:#2C2846; --soft:#25213C;
  --violet:#8F6BFF; --violet-ink:#B9A2FF; --hidden:#77718F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 16px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--violet);display:grid;place-items:center;color:#fff}
.brand b{font-family:var(--display);font-size:18px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12.5px}
.sidesearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:0 4px 10px;background:var(--paper)}
.sidesearch input{border:0;background:transparent;outline:none;width:100%;font-size:14px}
.navlabel{color:var(--muted);font-size:12.5px;padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:transparent;text-align:left;width:100%;font-weight:500;color:var(--ink)}
.nav svg{width:19px;height:19px;flex:none;opacity:.8}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .nav.on{background:var(--violet);color:#fff}
.nav .count{margin-left:auto;font-size:12px;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 8px;font-weight:600}
.nav.on .count{background:rgba(255,255,255,.18);color:inherit}
.phasecard{margin-top:auto;border-radius:var(--r-md);background:var(--soft);padding:14px}
.phasecard b{display:block;font-size:14px}
.phasecard p{margin:4px 0 10px;color:var(--muted);font-size:13px}
.steps{display:flex;gap:4px}
.steps i{height:6px;flex:1;border-radius:9px;background:var(--line)}
.steps i.done{background:var(--violet)}

.main{min-width:0;padding:18px 28px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.iconbtn.burger{display:none}
.crumb{color:var(--muted);font-size:14px}
.crumb b{color:var(--ink);font-weight:600}
.top .grow{flex:1}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
.me{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:99px;background:var(--card)}
.syncpill{border:0;cursor:pointer;padding:5px 11px}
body.locked .side nav,body.locked .side .navlabel,body.locked .sidesearch{display:none}
.login{max-width:420px;margin:6vh auto 0}
.login h1{font-family:var(--display);font-size:28px;margin:0 0 6px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.msg.bad{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.msg.ok{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green)}
.msg.warn{background:color-mix(in srgb,var(--amber) 14%,transparent);color:#b06d00}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--violet);flex:none}
.signature{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em;color:var(--violet-ink);background:var(--soft);border-radius:99px;padding:6px 14px;white-space:nowrap}

.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
.head h1{font-family:var(--display);font-size:30px;line-height:1.1;margin:0;font-weight:700}
.head p{margin:4px 0 0;color:var(--muted)}
.head .grow{flex:1}
.demo{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#8a5a00;background:#FFF3DC;border-radius:99px;padding:3px 10px;font-weight:600}
:root[data-theme="dark"] .demo{background:#3a2c10;color:#f2c56b}

/* ---------- atoms ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;min-width:0}
.wadest{margin-bottom:14px;padding:16px}
.card h3{font-size:16px;margin:0;font-weight:600}
.card .sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.cardhead{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.cardhead .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.pri:hover{background:var(--violet-ink)}
.btn.danger{color:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:500}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.free{background:color-mix(in srgb,var(--free) 14%,transparent);color:var(--free)}
.pill.prem{background:color-mix(in srgb,var(--prem) 14%,transparent);color:var(--prem)}
.pill.hid{background:color-mix(in srgb,var(--hidden) 18%,transparent);color:var(--hidden)}
.pill.warn{background:color-mix(in srgb,var(--amber) 16%,transparent);color:#b06d00}
.pill.bad{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
:root[data-theme="dark"] .pill.warn{color:var(--amber)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.muted{color:var(--muted)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
input.field,select.field,textarea.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 12px;outline:none}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--violet)}
label.lbl{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grid{display:grid;gap:18px}

/* ---------- overview ---------- */
.kpis{grid-template-columns:1.35fr 1fr 1fr 1fr}
.hero{background:var(--violet);color:#fff;border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .lab{opacity:.85;font-size:14px}
.hero .big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;margin:14px 0 6px;letter-spacing:-.01em}
.hero .delta{display:inline-block;background:rgba(255,255,255,.2);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}
.hero .split{display:flex;height:8px;border-radius:9px;overflow:hidden;margin-top:18px;gap:3px}
.hero .split span{display:block;height:100%;border-radius:9px}
.hero .legend{display:flex;gap:14px;margin-top:8px;font-size:12.5px;opacity:.9;flex-wrap:wrap}
.kpi .lab{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.kpi .ic{width:32px;height:32px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--violet)}
.kpi .ic svg{width:17px;height:17px}
.kpi .big{font-family:var(--display);font-size:32px;font-weight:700;margin:12px 0 2px;line-height:1.1}
.kpi .foot{font-size:13px;color:var(--muted)}
.up{color:var(--green);font-weight:600}
.down{color:var(--red);font-weight:600}
.row2{grid-template-columns:1.7fr 1fr;margin-top:18px}
.row3{grid-template-columns:1.25fr 1fr;margin-top:18px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl{border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.lvl .t{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.lvl .n{font-family:var(--display);font-size:24px;font-weight:700;margin:6px 0 0}
.lvl .s{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--violet);border-radius:9px}
.goal{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .gt{flex:1;min-width:0}
.goal .gt b{display:block;font-weight:600;font-size:14.5px}
.goal .gt span{font-size:12.5px;color:var(--muted)}
.goal .gv{text-align:right;font-size:13px;color:var(--muted)}
.goal .gv b{display:block;font-family:var(--display);font-size:17px;color:var(--ink)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);border-radius:10px;padding:7px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip b{font-family:var(--display)}
.legendrow{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legendrow span{display:inline-flex;align-items:center;gap:6px}

/* tables */
.tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:500;font-size:13px;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--soft)}
.who{display:flex;align-items:center;gap:10px;min-width:180px}
.who b{display:block;font-weight:600}
.who small{color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;font-size:13.5px;color:var(--muted)}
.empty{padding:36px 10px;text-align:center;color:var(--muted)}

/* access */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;padding:2px;background:var(--paper);flex:none}
.seg button{border:0;background:transparent;border-radius:9px;padding:4px 9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on.inh{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.seg button.on.gratuit{background:var(--free);color:#fff}
.seg button.on.premium{background:var(--prem);color:#fff}
.seg button.on.masque{background:var(--hidden);color:#fff}
.accgrid{grid-template-columns:1fr 1fr}
.lvlmatrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:center}
.lvlmatrix .h{font-size:13px;color:var(--muted);text-align:center}
.lvlmatrix .r{font-weight:600}
.lvlmatrix .c{display:flex;justify-content:center}
.feat{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.feat:first-child{border-top:0}
.feat .ft{flex:1;min-width:0}
.feat .ft b{display:block;font-weight:600;font-size:14.5px}
.feat .ft span{font-size:12.5px;color:var(--muted)}
.rub{margin-top:18px}
.rubhead{display:flex;align-items:center;gap:12px;padding:6px 4px 10px;flex-wrap:wrap}
.rubhead h3{font-family:var(--display);font-size:19px;margin:0;font-weight:700}
.mat{border-radius:var(--r-md);background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;border-left:5px solid var(--free);overflow:hidden}
.mat.st-premium{border-left-color:var(--prem)}
.mat.st-masque{border-left-color:var(--hidden)}
.mathead{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.mathead .mt{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:0}
.mathead .mt b{font-weight:600;font-size:15px}
.mathead .mt small{display:block;color:var(--muted);font-size:12.5px}
.chev{width:18px;height:18px;transition:transform .15s;flex:none;color:var(--muted)}
.mat.open .chev{transform:rotate(90deg)}
.quota{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.quota input{width:52px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--paper);text-align:center}
.matbody{display:none;border-top:1px solid var(--line);padding:6px 14px 12px}
.mat.open .matbody{display:block}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:0}
.item .it{flex:1;min-width:150px;font-size:14px}
.item .eff{font-size:12px;color:var(--muted);min-width:120px}
.summary{display:flex;gap:10px;flex-wrap:wrap}
.summary .s{flex:1;min-width:140px;border-radius:var(--r-md);padding:14px;background:var(--card);box-shadow:var(--shadow)}
.summary .s b{font-family:var(--display);font-size:26px;display:block}
.summary .s span{font-size:13px;color:var(--muted)}

/* misc pages */
.annonce{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.annonce:first-child{border-top:0}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;color:#fff;font-weight:500}
.report{padding:14px 0;border-top:1px solid var(--line)}
.report:first-child{border-top:0}
.report q{display:block;background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px;quotes:none}
.hm{border-collapse:separate;border-spacing:4px;font-size:13px;width:100%}
.hm td,.hm th{text-align:center;padding:6px 4px;border-radius:8px}
.hm th{color:var(--muted);font-weight:500}
.hm td.l{text-align:left;color:var(--muted);white-space:nowrap}
pre.code{background:var(--ink);color:#E9E4FF;border-radius:var(--r-md);padding:14px;overflow:auto;font-size:12.5px;line-height:1.55;margin:10px 0 0}
:root[data-theme="dark"] pre.code{background:#0c0a16}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(20,16,40,.45);display:none;z-index:40}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--card);z-index:50;transform:translateX(105%);transition:transform .22s ease;overflow:auto;padding:22px;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);width:min(520px,calc(100% - 28px));max-height:calc(100% - 40px);overflow:auto;background:var(--card);border-radius:var(--r-lg);z-index:60;padding:22px;display:none}
.modal.on{display:block;transform:translate(-50%,-50%)}
.x{float:right}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:500;opacity:0;transition:.2s;z-index:80;max-width:calc(100% - 30px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.kv span{color:var(--muted)}
.sect{font-weight:700;font-size:14.5px;margin:20px 0 8px}

/* responsive */
@media (max-width:1100px){
  .kpis{grid-template-columns:1fr 1fr}
  .row2,.row3,.accgrid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .syncpill{display:none}
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:55;width:280px;transform:translateX(-105%);transition:transform .22s}
  .side.on{transform:none}
  .iconbtn.burger{display:grid}
  .main{padding:12px 14px 70px}
  .head h1{font-size:25px}
  .signature{font-size:13px;padding:5px 11px}
  .me span.nm{display:none}
  .crumb{display:none}
  .levels{grid-template-columns:repeat(2,1fr)}
  .hero .big{font-size:40px}
  .card{padding:16px}
  .tablewrap{margin:0 -16px;padding:0 16px}
  .kv{grid-template-columns:110px 1fr}
}
@media (max-width:520px){
  .kpis{gap:10px}
  .kpis .hero{grid-column:1 / -1}
  .kpi .big{font-size:26px}
  .kpi .lab{font-size:13px}
  .kpi .ic{display:none}
}
@media (max-width:720px){
  .paycards thead{display:none}
  .paycards,.paycards tbody,.paycards tr,.paycards td{display:block;width:100%}
  .paycards tr{border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;background:var(--card)}
  .paycards td{border:0!important;padding:5px 0!important;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .paycards td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:13px;text-align:left}
  .paycards td.pc-who{justify-content:flex-start;text-align:left;padding-bottom:8px!important}
  .paycards td.pc-act{padding-top:10px!important}
  .paycards td.pc-act .row{width:100%}.paycards td.pc-act .btn{flex:1;justify-content:center;padding:12px}
  .paycards td[colspan]{display:block}
}
/* téléphone : rien ne dépasse de l'écran */
.main{min-width:0}
.codelist{grid-template-columns:minmax(0,1fr)}.coderow>*{min-width:0;max-width:100%}
.codeform>*{min-width:0}.codeform .field,.codeform select{max-width:100%;width:100%}
@media (max-width:860px){html,body{overflow-x:clip}}
@media (max-width:520px){
  .top{gap:6px}
  .signature{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:4px 9px}
  .iconbtn{width:34px;height:34px;flex:none}.me{flex:none;padding:3px}
  .coderow{padding:10px}.coderow .row .btn{flex:1 1 auto;justify-content:center}
  .codesneufs .row .btn{flex:1 1 auto;justify-content:center}
  .seg{flex:0 1 auto;flex-wrap:wrap;max-width:100%}.seg button{padding:4px 7px}
  .cardhead{flex-wrap:wrap}.cardhead>.grow{min-width:0;flex-basis:100%}
  .btn{max-width:100%;white-space:normal;text-align:center}
}
.live{margin-bottom:18px}
.live-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.live-top .muted{font-size:13px;flex:1}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent);animation:livepulse 2s infinite}
.live-dot.off{background:var(--muted);animation:none}

.live-main{display:flex;align-items:center;gap:16px;margin-top:10px}.live-main .big{font-size:44px;font-weight:800;line-height:1}
.live-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.live-who{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;cursor:pointer}
.live-who .av{width:26px;height:26px;font-size:11px}

/* ---------- lisibilité : texte plus grand et plus contrasté ---------- */
:root{--muted:#57516F}
:root[data-theme="dark"]{--muted:#BDB7D6}
html,body{font-size:16px}
.card .sub,.feat .ft span,.mathead .mt small,.quota,.summary .s span,.brand small,.phasecard p,.kpi .lab{font-size:14px}
.navlabel{font-size:13.5px;font-weight:600}
.nav{font-size:15.5px}
.pill{font-size:13.5px}.chip{font-size:15px;padding:7px 14px}.btn{font-size:15px}.btn.sm{font-size:14px}
.seg button{font-size:14px;padding:6px 11px}
.item .it{font-size:15px}.item .eff{font-size:13.5px}
.head p{font-size:16px}
body.bigtxt .app{zoom:1.15}
.iconbtn.txt{font-weight:800;font-size:15px;width:auto;padding:0 10px}

/* ---------- cours gratuits / Premium ---------- */
.syncbox{display:flex;gap:14px;align-items:flex-start;border-radius:var(--r-lg);padding:16px 18px;margin:0 0 16px;border:2px solid var(--line);background:var(--card)}
.syncbox.ok{background:color-mix(in srgb,var(--green) 9%,var(--card));border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.syncbox.warn{background:color-mix(in srgb,var(--amber) 11%,var(--card));border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.syncbox.bad{background:color-mix(in srgb,var(--red) 9%,var(--card));border-color:color-mix(in srgb,var(--red) 45%,transparent)}
.syncbox .si{font-size:28px;line-height:1.1}
.syncbox b{font-size:17px;display:block}
.syncbox p{margin:4px 0 0;font-size:15px;line-height:1.45}
.cstat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.cstat button{border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);border-radius:var(--r-md);padding:14px 16px;text-align:left}
.cstat button.on{border-color:var(--ink)}
.cstat b{font-family:var(--display);font-size:34px;line-height:1;display:block}
.cstat span{font-size:15px;font-weight:600}
.cstat .gratuit b{color:var(--free)}.cstat .premium b{color:var(--prem)}.cstat .masque b{color:var(--hidden)}
.ctool{display:flex;gap:12px 18px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.ctool .srch{flex:1 1 260px;display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--paper)}
.ctool .srch:focus-within{border-color:var(--violet)}
.ctool .srch svg{width:19px;height:19px;flex:none;color:var(--muted)}
.ctool .srch input{border:0;background:transparent;outline:none;width:100%;font-size:16px}
.ctool .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctool .grp>span{font-size:14px;font-weight:700;color:var(--muted);margin-right:2px}
.bulk{position:sticky;top:8px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--paper);border-radius:16px;padding:10px 14px;margin-bottom:12px;box-shadow:0 10px 30px -12px rgba(0,0,0,.45)}
.bulk b{font-size:16px;flex:1 1 160px}
.bulk .btn{border:0;background:var(--card);color:var(--ink)}
.bulk .btn.g{background:var(--free);color:#fff}.bulk .btn.p{background:var(--prem);color:#fff}.bulk .btn.h{background:var(--hidden);color:#fff}
.crub{margin-top:22px}
.crubhead{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;margin:0 2px 10px}
.crubhead h2{font-family:var(--display);font-size:23px;margin:0;flex:1 1 200px}
.crubhead .lab{font-size:14px;color:var(--muted);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.course{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;border:2px solid var(--line);border-top:7px solid var(--free);display:flex;flex-direction:column;gap:12px;min-width:0}
.course.st-premium{border-top-color:var(--prem)}
.course.st-masque{border-top-color:var(--hidden)}
.course.st-masque h4{color:var(--muted)}
.course.sel{border-color:var(--violet);box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent)}
.ctop{display:flex;gap:12px;align-items:flex-start}
.ctop input[type=checkbox]{width:22px;height:22px;margin:3px 0 0;accent-color:var(--violet);flex:none;cursor:pointer}
.ctop h4{margin:0;font-size:18px;line-height:1.3;font-weight:700}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tag{font-size:13.5px;font-weight:600;background:var(--soft);color:var(--ink);border-radius:8px;padding:2px 8px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.big3 button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:11px 4px;font-weight:700;font-size:15.5px;color:var(--muted)}
.big3 button:hover{border-color:var(--muted);color:var(--ink)}
.big3 button.on.gratuit{background:var(--free);border-color:var(--free);color:#fff}
.big3 button.on.premium{background:var(--prem);border-color:var(--prem);color:#fff}
.big3 button.on.masque{background:var(--hidden);border-color:var(--hidden);color:#fff}
.trial{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--prem) 9%,transparent);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:600}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.step button{border:0;background:transparent;width:36px;height:36px;font-size:20px;font-weight:700;color:var(--ink)}
.step b{min-width:30px;text-align:center;font-size:17px}
.qgin{width:58px;border:0;background:transparent;text-align:center;font-size:17px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.qgin::-webkit-inner-spin-button,.qgin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.qgseg button{font-size:14px;padding:7px 10px}
.qgseg{flex-wrap:wrap;flex:0 1 auto}
.qgseg button.on{background:var(--prem);color:#fff}
.plusbox{margin-top:12px;border-top:1px dashed var(--line,#ddd);padding-top:10px}
.plush{font-weight:700;margin-bottom:6px}
.plusrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}
.plust{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.plusseg{flex-wrap:wrap}.plusseg button{font-size:13.5px;padding:6px 9px}
.plusseg button.on{background:var(--prem);color:#fff}
.cfoot{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.cnote{font-size:14px;color:var(--muted)}
.lnk{border:0;background:transparent;color:var(--violet-ink);font-weight:700;font-size:14.5px;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.fine{border-top:1px dashed var(--line);padding-top:4px}
details.adv{margin-top:28px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:4px 18px 14px}
details.adv>summary{cursor:pointer;font-weight:700;font-size:18px;padding:12px 0}
details.adv .accgrid .card{box-shadow:none;border:1px solid var(--line)}
.cempty{padding:30px;text-align:center;color:var(--muted);font-size:16px;background:var(--card);border-radius:var(--r-lg)}
@media (max-width:860px){.cstat{gap:8px}.cstat button{padding:12px}.cstat b{font-size:28px}.cstat span{font-size:14px}.cgrid{grid-template-columns:1fr}.big3 button{font-size:15px;padding:12px 2px}}

/* ---------- signalements ---------- */
.sigalert{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:16px;border:2px solid color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 8%,var(--card))}
.sigalert.off{border-color:color-mix(in srgb,var(--amber) 50%,transparent);background:color-mix(in srgb,var(--amber) 10%,var(--card))}
.sigalert .si{font-size:26px}.sigalert b{font-size:16.5px;display:block}.sigalert p{margin:3px 0 0;font-size:15px}
.siglist{display:grid;gap:12px}
.sigcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;border-left:7px solid var(--red)}
.sigcard.st-en-cours{border-left-color:var(--amber)}.sigcard.st-corrige{border-left-color:var(--green)}
.sighead{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:baseline}.sighead b{font-size:18px;flex:1 1 220px}
.sigq,.sigmsg{border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15.5px;line-height:1.5}
.sigq{background:var(--soft)}.sigmsg{background:color-mix(in srgb,var(--amber) 10%,transparent);font-weight:600}
.sigq .lab,.sigmsg .lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.sigph{margin-top:10px}.sigph img{max-width:min(100%,420px);max-height:320px;border-radius:12px;display:block;border:1px solid var(--line)}
a.btn{text-decoration:none}

/* ---------- codes d'activation ---------- */
.codeform{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1px;font-size:16px}
.code.big{background:var(--soft);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:17px}
.codesneufs{margin-top:14px;padding:14px;border-radius:14px;border:2px dashed var(--green);background:color-mix(in srgb,var(--green) 7%,var(--card))}
.codelist{display:grid;gap:8px}
.coderow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.coderow .cc{display:flex;flex-direction:column;gap:2px;min-width:0}.coderow small{font-size:13.5px;color:var(--muted)}
.coderow small.ok{color:var(--green);font-weight:600}.coderow small.bad{color:var(--red);font-weight:600}
.coderow.used,.coderow.off{opacity:.8}
.btn.wa{background:#25D366;color:#fff;border-color:#25D366}

/* index des nœuds pour la résolution des règles */
const NODES = {}; // key -> {key, parent, label, type}
function buildNodes(){
  for(const k in NODES) delete NODES[k];
  for(const r of CATALOGUE){
    NODES['rubrique:'+r.id] = {key:'rubrique:'+r.id, parent:null, label:r.nom, type:'rubrique'};
    for(const m of r.matieres){
      const mk='matiere:'+m.id;
      /* un contenu ajouté qui « suit » un cours (ex. Exercices corrigés → Pédiatrie) hérite de ce cours, comme dans l'appli des élèves */
      NODES[mk] = {key:mk, parent:m.suit?'matiere:'+m.suit:'rubrique:'+r.id, label:m.nom, type:'matiere', m};
      /* même titre que dans l'appli et l'éditeur (catalogue.json : « Médecine · Daloa · 2026 », « Révision de gynécologie sujet 1 »…) */
      for(let i=1;i<=sujetsOf(m);i++){ const t=(Array.isArray(m.sujets)&&m.sujets[i-1]&&m.sujets[i-1][0])||`Sujet ${i}`; NODES[`${mk}/sujet:${i}`] = {key:`${mk}/sujet:${i}`, parent:mk, label:t, type:'sujet', n:i}; }
      NODES[mk+'/resumes'] = {key:mk+'/resumes', parent:mk, label:'Résumés de cours', type:'resumes'};
      NODES[mk+'/appli'] = {key:mk+'/appli', parent:mk, label:'Application complète', type:'appli'};
    }
  }
  for(const f of FONCTIONS) NODES['fonction:'+f.id] = {key:'fonction:'+f.id, parent:null, label:f.nom, type:'fonction'};
  for(const f of FILIERES) for(const a of ANNEES) NODES[`niveau:${f}-${a}`] = {key:`niveau:${f}-${a}`, parent:null, label:`${f} ${a}`, type:'niveau'};
}
buildNodes();

function prettyRub(n){ n = String(n||''); if(n.length>4 && n===n.toUpperCase()) n = n[0]+n.slice(1).toLowerCase(); return n.replace(/\bd\.e\b/i,'D.E'); }
function applyCatalogue(c, src){
  if(!c || !Array.isArray(c.rubriques) || !c.rubriques.length) return false;
  CATALOGUE = c.rubriques.map(r=>({id:r.id, nom:prettyRub(r.nom), matieres:(r.matieres||[]).map(m=>Object.assign({id:m.id, nom:m.nom, court:m.court, niv:m.niv||[], fil:m.fil, q:m.q||0, nsuj:m.nsuj||1}, m.suit?{suit:m.suit}:{}, Array.isArray(m.sujets)?{sujets:m.sujets}:{}, Array.isArray(m.plus)&&m.plus.length?{plus:m.plus}:{}))})).filter(r=>r.matieres.length);
  buildNodes(); CAT_INFO = {source:src, genere:c.genere||null, erreur:''}; return true;
}
function portailUrl(){ return String((typeof getCfg==='function' && getCfg().portail) || PORTAIL_DEFAUT).trim().replace(/\/?$/,'/'); }

async function loadCatalogue(){
  try{
    const ctl = new AbortController(), tm = setTimeout(()=>ctl.abort(), 8000);
    const r = await fetch(portailUrl()+'catalogue.json?t='+Date.now(), {cache:'no-store', signal:ctl.signal});
    clearTimeout(tm);
    if(!r.ok) throw new Error(r.status===404 ? 'catalogue.json introuvable : republiez le portail depuis le Studio' : 'erreur '+r.status);
    const c = await r.json();
    if(!applyCatalogue(c,'portail')) throw new Error('fichier catalogue.json invalide');
    try{ localStorage.setItem(CAT_KEY, JSON.stringify(c)); }catch(e){}
    return true;

}

  if(/Email not confirmed/i.test(m)) return 'E-mail non confirmé : confirmez le compte dans Supabase (Authentication).';

async function fetchAll(t, opts={}){
  if(opts.limit){ const {data,error} = await SB.from(t).select('*').order(opts.order,{ascending:false}).limit(opts.limit); if(error) throw error; return data; }
  let all=[], from=0;
  for(;;){ const {data,error} = await SB.from(t).select('*').range(from, from+999); if(error) throw error; all = all.concat(data); if(data.length<1000) break; from += 1000; }
  return all;
}

async function syncAll(){
  const db = DB;
  const plan = [];
  MAP.forEach(m=>plan.push({t:m.t, id:m.id, noDelete:m.noDelete, rows:db[m.k].map(m.to)}));
  VIRTUAL.forEach(v=>plan.push({t:v.t, id:v.id, noDelete:v.noDelete, rows:v.rows(db)}));
  // 1) ajouts et modifications, parents d'abord
  for(const p of plan){
    const prev = SNAP[p.t] || new Map();
    const changed = p.rows.filter(r=>prev.get(r[p.id])!==JSON.stringify(r));
    const lots = {}; changed.forEach(r=>{ const k=Object.keys(r).sort().join(','); (lots[k]=lots[k]||[]).push(r); });
    for(const L of Object.values(lots)) for(let i=0;i<L.length;i+=500){
      const {error} = await SB.from(p.t).upsert(L.slice(i,i+500), {onConflict:p.id});
      if(error) throw error;
    }
    changed.forEach(r=>prev.set(r[p.id], JSON.stringify(r)));
    SNAP[p.t] = prev;
  }
  // 2) suppressions, enfants d'abord
  for(const p of [...plan].reverse()){
    if(p.noDelete) continue;
    const prev = SNAP[p.t], now = new Set(p.rows.map(r=>r[p.id]));
    const gone = [...prev.keys()].filter(id=>!now.has(id));
    for(let i=0;i<gone.length;i+=200){
      const {error} = await SB.from(p.t).delete().in(p.id, gone.slice(i,i+200));
      if(error) throw error;
    }
    gone.forEach(id=>prev.delete(id));
  }
}

/* Les anciens identifiants (u1004…) deviennent des UUID, comme dans la base */
const isUUID = s => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(s||''));
function normalizeIds(db){
  const map = {};
  const fix = id => isUUID(id) ? id : (map[id] || (map[id] = uid()));
  db.profiles.forEach(p=>p.id = fix(p.id));
  db.entitlements = db.entitlements.filter(e=>isUUID(e.user_id) || map[e.user_id]);
  db.entitlements.forEach(e=>{ e.id = fix(e.id); e.user_id = fix(e.user_id); });
  db.reports.forEach(r=>{ r.id = fix(r.id); r.user_id = isUUID(r.user_id) ? r.user_id : (map[r.user_id] || null); });
  ['announcements','audit_log'].forEach(t=>(db[t]||[]).forEach(x=>x.id = fix(x.id)));
  return db;
}

const api = {
  list(table){ return DB[table]; },
  get(table,id){ return DB[table].find(r=>r.id===id); },
  insert(table,row){ row.id = row.id || uid(); DB[table].push(row); persist(); return row; },
  update(table,id,patch){ const r=api.get(table,id); if(r){ Object.assign(r,patch); persist(); } return r; },
  remove(table,id){ DB[table] = DB[table].filter(r=>r.id!==id); persist(); },
};

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{ const r=Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
}

/* résolution des règles d'accès : la règle la plus précise gagne */
function effective(key){
  const n = NODES[key]; const rules = DB.access.regles;
  if(rules[key]) return {acces:rules[key].acces, source:'explicite'};
  if(!n) return {acces:DB.access.defaut, source:'defaut'};
  if(n.type==='sujet'){
    const parent = effective(n.parent);
    const q = quotaOf(n.parent);
    if(parent.acces==='premium' && n.n <= q) return {acces:'gratuit', source:'quota'};
    return {acces:parent.acces, source:'herite'};
  }
  if(n.parent){
    const p = effective(n.parent);
    return {acces:p.acces, source: p.source==='defaut'?'defaut':'herite'};
  }
  return {acces:DB.access.defaut, source:'defaut'};
}
function quotaOf(key){
  let k = key;
  while(k){ const r = DB.access.regles[k]; if(r && r.quotaGratuit!=null) return r.quotaGratuit; k = NODES[k]?.parent; }
  return 0;
}
/* questions gratuites dans les sujets Premium : {n, mode:'sujet'|'cours'} — même héritage que l'appli des élèves */
function qgOf(key){
  const Q = DB.access.questions||{}; let k = key;
  while(k){ const r = Q[k]; if(r && r.n!=null) return Object.assign({n:0, mode:'sujet'}, r, {de:k}); k = NODES[k]?.parent; }
  return {n:0, mode:'sujet', de:null};
}
function setQg(key, patch){
  const Q = DB.access.questions = DB.access.questions||{}; const cur = qgOf(key);
  const v = Object.assign({n:cur.n, mode:cur.mode}, patch); v.n = Math.max(0, Math.min(500, parseInt(v.n,10)||0)); v.mode = v.mode==='cours'?'cours':'sujet';
  Q[key] = v; DB.access.version++; DB.access.misAJour = new Date().toISOString();
  audit(`Questions gratuites : ${v.n} ${v.mode==='cours'?'au total pour le cours':'dans chaque sujet'}`, labelOf(key));
}
function qgCard(mk, ns, nq){

function niceMax(v){ v = Math.max(v,4); const p = Math.pow(10, Math.floor(Math.log10(Math.max(v,1)))); return Math.ceil(v/p)*p; }
function areaChart(series, labels, opt={}){
  const W=640, H=230, pl=36, pr=8, pt=12, pb=26;
  const max = niceMax(Math.max(...series.flatMap(s=>s.data)));
  const x = i => pl + i*(W-pl-pr)/(labels.length-1);
  const y = v => pt + (H-pt-pb)*(1 - v/max);
  const smooth = pts => pts.map((p,i)=> i? `C${(pts[i-1][0]+p[0])/2},${pts[i-1][1]} ${(pts[i-1][0]+p[0])/2},${p[1]} ${p[0]},${p[1]}` : `M${p[0]},${p[1]}`).join(' ');
  let g='';
  for(let k=0;k<=4;k++){ const v=max*k/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${k?'stroke-dasharray="3 4"':''}/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000)+'k':v}</text>`; }
  const step = Math.ceil(labels.length/7);
  labels.forEach((l,i)=>{ if(i%step===0 || i===labels.length-1) g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`; });
  let defs='', paths='';
  series.forEach((s,si)=>{
    const pts = s.data.map((v,i)=>[x(i),y(v)]);
    const line = smooth(pts);
    defs += `<linearGradient id="ag${si}${opt.id||''}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity="${si?0.12:0.28}"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;
    paths += `<path d="${line} L${x(pts.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="url(#ag${si}${opt.id||''})"/><path d="${line}" fill="none" stroke="${s.color}" stroke-width="2.2"/>`;
  });
  const id = 'c'+uid();
  setTimeout(()=>bindHover(id, labels.length, i=>x(i), W, i=>{
    return `<div class="muted" style="color:inherit;opacity:.75">${opt.full?opt.full[i]:labels[i]}</div>`+series.map(s=>`<div><span class="dot" style="background:${s.color}"></span> ${s.name} : <b>${fmt(s.data[i])}</b></div>`).join('');
  }, i=>y(series[0].data[i]), H), 0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Graphique')}"><defs>${defs}</defs>${g}${paths}<line class="hl" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--violet)" stroke-dasharray="3 3" opacity="0"/><circle class="hp" r="5" fill="var(--violet)" stroke="var(--card)" stroke-width="2" opacity="0"/><rect class="ov" x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
function bindHover(id, n, xf, W, html, yf, H){
  const el = document.getElementById(id); if(!el) return;
  const svg = el.querySelector('svg'), ov = el.querySelector('.ov'), tip = el.querySelector('.tip'), hl = el.querySelector('.hl'), hp = el.querySelector('.hp');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const cx = ((ev.touches?ev.touches[0].clientX:ev.clientX) - r.left) * W / r.width;
    let best=0, bd=1e9; for(let i=0;i<n;i++){ const d=Math.abs(xf(i)-cx); if(d<bd){bd=d;best=i;} }
    const px = xf(best);
    if(hl){ hl.setAttribute('x1',px); hl.setAttribute('x2',px); hl.setAttribute('opacity',1); }
    if(hp && yf){ hp.setAttribute('cx',px); hp.setAttribute('cy',yf(best)); hp.setAttribute('opacity',1); }
    tip.innerHTML = html(best); tip.style.left = (px*r.width/W)+'px'; tip.style.top = ((yf?yf(best):30)*r.height/H)+'px'; tip.style.opacity=1;
  };

  ov.addEventListener('mousemove',move); ov.addEventListener('touchstart',move,{passive:true}); ov.addEventListener('touchmove',move,{passive:true}); ov.addEventListener('mouseleave',out); ov.addEventListener('touchend',()=>setTimeout(out,1500));
}
function barChart(data, labels, color, opt={}){
  const W=640, H=200, pl=34, pr=6, pt=10, pb=24;
  const max = niceMax(Math.max(...data));
  const bw = (W-pl-pr)/data.length;
  const y = v => pt + (H-pt-pb)*(1 - v/max);
  let g='';
  for(let k=0;k<=4;k++){ const v=max*k/4, yy=y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="var(--line)" ${k?'stroke-dasharray="3 4"':''}/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000)+'k':v}</text>`; }
  data.forEach((v,i)=>{ const h = y(0)-y(v); g+=`<rect x="${pl+i*bw+bw*0.18}" y="${y(v)}" width="${bw*0.64}" height="${Math.max(h,1)}" rx="${Math.min(4,bw*0.3)}" fill="${color}" opacity="${i===data.length-1?1:0.55}"/>`; });
  const step = Math.ceil(labels.length/8);
  labels.forEach((l,i)=>{ if(i%step===0) g+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`; });
  const id='b'+uid();
  setTimeout(()=>bindHover(id, data.length, i=>pl+i*bw+bw/2, W, i=>`<div style="opacity:.75">${opt.full?opt.full[i]:labels[i]}</div><b>${fmt(data[i])}</b> ${opt.unit||''}`, i=>y(data[i]), H),0);
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label||'Graphique en barres')}">${g}<rect class="ov" x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div>`;
}
function donut(parts, centerTop, centerBig){
  const total = parts.reduce((a,p)=>a+p.v,0)||1; const R=70, r=48, C=90;
  let a0=-Math.PI/2, segs='';
  const gap = 0.035;
  parts.forEach(p=>{
    if(!p.v) return;
    const a1 = a0 + 2*Math.PI*p.v/total;
    const s = a0+gap/2, e = Math.max(s+0.001, a1-gap/2), large = (e-s)>Math.PI?1:0;
    const P = (rad,a)=>[C+rad*Math.cos(a), C+rad*Math.sin(a)];
    const [x1,y1]=P(R,s),[x2,y2]=P(R,e),[x3,y3]=P(r,e),[x4,y4]=P(r,s);
    segs += `<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4} Z" fill="${p.c}"><title>${esc(p.l)} : ${fmt(p.v)}</title></path>`;
    a0 = a1;
  });
  return `<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Répartition">${segs}<text x="90" y="84" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(centerTop)}</text><text x="90" y="108" text-anchor="middle" font-size="24" font-weight="700" font-family="var(--display)" fill="var(--ink)">${esc(centerBig)}</text></svg>`;
}
function ring(pct, color){
  const r=19, c=2*Math.PI*r, v=Math.max(0,Math.min(1,pct));
  return `<svg width="50" height="50" viewBox="0 0 50 50" role="img" aria-label="${Math.round(v*100)} %"><circle cx="25" cy="25" r="${r}" fill="none" stroke="var(--soft)" stroke-width="5"/><circle cx="25" cy="25" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 25 25)"/><text x="25" y="29" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">${Math.round(v*100)}%</text></svg>`;
}

/* ---------- Heures de connexion : traces « connexion » / « ouverture » envoyées par l'appli (fonction SQL connexions) ---------- */
let CNX = null;
async function loadCnx(){
  if(MODE!=='supabase' || !SB){ CNX = null; return; }
  try{ const {data,error} = await SB.rpc('connexions', {p_jours:30});
    CNX = error ? {err: /connexions|function|PGRST/i.test(String(error.message||'')) ? 'sql' : 'reseau'} : {L: cnxPrep(data||[])}; }
  catch(e){ CNX = {err:'reseau'}; }
}
function cnxPrep(rows){ // une connexion par appareil et par tranche de 10 minutes ; rattachée à l'élève par son compte ou son appareil
  const L = rows.filter(x=>x && x.t).sort((a,b)=>new Date(b.t)-new Date(a.t)), last = {}, out = [];
  for(const x of L){ const t = new Date(x.t).getTime(), k = x.a||'?'; if(last[k]!=null && last[k]-t < 10*60e3) continue; last[k] = t; out.push(x); }
  const nomA = {}, filA = {}; L.forEach(x=>{ if(x.a && x.m && !nomA[x.a]) nomA[x.a] = x.m; if(x.a && x.f && !filA[x.a]) filA[x.a] = [x.f, x.n]; }); // le nom le plus récent tapé sur chaque appareil
  out.forEach(x=>{ if(!x.m && nomA[x.a]) x.m = nomA[x.a]; if(!x.f && filA[x.a]){ x.f = filA[x.a][0]; x.n = filA[x.a][1]; } });
  out.forEach(x=>{ const p = (x.c && DB.profiles.find(p=>p.auth_id===x.c)) || (x.a && DB.profiles.find(p=>(p.appareils||[]).some(a=>String(a).includes(x.a)))); x.pid = p ? p.id : null; });
  return out;
}
function cnxData(){ // en données locales : exemple tiré des dernières visites
  if(CNX) return CNX;
  return {demo:true, L: DB.profiles.flatMap((p,i)=>[0,1,2].map(j=>({t:new Date(new Date(p.last_seen).getTime() - j*(26+i%5)*36e5 - (i*7%50)*6e4).toISOString(), pid:p.id, a:'demo'})))
    .filter(x=>Date.now()-new Date(x.t).getTime() < 30*DAY).sort((a,b)=>new Date(b.t)-new Date(a.t))};
}
const cnxDe = pid => { const X = cnxData(); return X.L ? X.L.filter(x=>x.pid===pid) : []; };
const dhfr = iso => `${dfr(iso,{weekday:'short',day:'numeric',month:'short'})} à ${hfr(iso)}`;

function filteredUsers(){
  const s = UI.eleves, q = s.q.trim().toLowerCase();
  return DB.profiles.filter(p=>{
    if(q && !(fullName(p)+' '+p.telephone+' '+p.id+' '+(p.email||'')).toLowerCase().includes(q)) return false;
    if(s.type==='compte' && !p.auth_id) return false;
    if(s.type==='test' && p.auth_id) return false;
    if(s.fil!=='tous' && p.filiere!==s.fil) return false;
    if(s.an!=='tous' && p.annee!==s.an) return false;
    const pass = activePass(p.id);
    if(s.acc==='premium' && !pass) return false;
    if(s.acc==='gratuit' && pass) return false;
    if(s.acc==='expire' && !(pass && daysLeft(pass)<=7)) return false;
    if(s.acc==='bloque' && p.statut!=='bloque') return false;
    return true;
  }).sort((a,b)=>new Date(b.last_seen)-new Date(a.last_seen));
}
function accessPill(p){
  if(p.statut==='bloque') return '<span class="pill bad">Bloqué</span>';
  const pass = activePass(p.id);
  if(!pass) return '<span class="pill free">Gratuit</span>';
  const d = daysLeft(pass);
  return d<=7 ? `<span class="pill warn">Premium · ${d} j</span>` : `<span class="pill prem">Premium · ${dfr(pass.end,{day:'numeric',month:'short'})}</span>`;
}

let CPART=null, CPART_ERR='', CPART_OUV={};
async function chargerCpart(){ if(MODE!=='supabase'||!SB){ CPART=null; return; } try{ const {data,error}=await SB.rpc('lister_codes_partages'); if(error) throw error; CPART=data||[]; CPART_ERR=''; }catch(e){ CPART=[]; CPART_ERR=/function|PGRST|404/.test(String(e&&e.message||e))?'Lance d’abord supabase/codes/3_codes_partages.sql dans Supabase (SQL Editor → Run).':frErr(e); } }
function cpartEtat(c){ if(c.annule) return ['Arrêté','warn']; if(new Date(c.active_jusqu)<new Date()) return ['Expiré','warn']; if(c.activations>=c.max_personnes) return ['Complet','warn']; return ['Actif','ok']; }
function cpartTexte(c){ return `🎁 Révision INFAS : code Premium « ${c.code} » (${c.jours} jour${c.jours>1?'s':''} gratuits).\nDans l’appli : touche « Passer Premium » puis « J’ai un code », et tape ${c.code}.\nÀ activer avant le ${dfr(c.active_jusqu,{day:'numeric',month:'long'})} à ${hfr(c.active_jusqu)} · ${c.max_personnes} personne${c.max_personnes>1?'s':''} maximum.`; }

    return `<div class="coderow"><div class="cc" style="flex:1 1 240px;min-width:0"><div><b class="code big">${esc(c.code)}</b> <span class="pill ${cl==='ok'?'':'warn'}">${et}</span></div>

function bindCpart(){
  if(MODE!=='supabase') return;
  if(CPART===null){ chargerCpart().then(()=>{ if(page==='paiements') render(); }); }
  const f = UI.cpartF = UI.cpartF||{};
  const lire = ()=>{ ['code','plan','jours','jusqu','max','note'].forEach(k=>{ const e=$('#cp'+k[0].toUpperCase()+k.slice(1)); if(e) f[k]=e.value; }); };
  ['#cpCode','#cpPlan','#cpJours','#cpJusqu','#cpMax','#cpNote'].forEach(id=>{ const e=$(id); if(e) e.oninput=lire; });
  const parCode = c=>(CPART||[]).find(x=>x.code===c);
  if($('#cpartReload')) $('#cpartReload').onclick=async()=>{ await chargerCpart(); render(); toast('Codes à jour.'); };
  if($('#cpGo')) $('#cpGo').onclick=async()=>{ lire(); const code=String(f.code||'').toUpperCase().replace(/[^A-Z0-9]/g,''), jours=parseInt(f.jours,10), max=parseInt(f.max,10), jusqu=new Date(f.jusqu);
    if(code.length<4||code.length>20){ toast('Le code doit avoir 4 à 20 lettres ou chiffres.'); return; }
    if(!(jours>=1&&jours<=730)){ toast('Durée : entre 1 et 730 jours.'); return; }
    if(!(jusqu>new Date())){ toast('La date limite doit être dans le futur.'); return; }
    if(!(max>=1)){ toast('Nombre de personnes : au moins 1.'); return; }
    $('#cpGo').disabled=true;
    try{ const {data,error}=await SB.rpc('creer_code_partage',{p_code:code,p_plan:f.plan||((DB.plans||[]).find(p=>p.actif)||{}).id,p_jours:jours,p_jusqu:jusqu.toISOString(),p_max:max,p_note:(f.note||'').trim()}); if(error) throw error;
      if(!data||!data.ok){ toast({format:'Code refusé : 4 à 20 lettres ou chiffres.',existe:'Ce code ressemble à un code RI déjà créé : choisis-en un autre.',pass:'Choisis un pass.',jours:'Durée invalide.',date:'Date limite invalide.',max:'Nombre de personnes invalide.'}[data&&data.raison]||'Code refusé.'); $('#cpGo').disabled=false; return; }
      audit('Code à partager créé', `${data.code} · ${jours} j · ${max} pers.`); UI.cpartF={}; await chargerCpart(); render(); toast(`Code ${data.code} prêt à partager.`);
    }catch(e){ toast(/function|PGRST|404/.test(String(e&&e.message||e))?'Lance d’abord supabase/codes/3_codes_partages.sql dans Supabase.':frErr(e)); if($('#cpGo')) $('#cpGo').disabled=false; } };
  document.querySelectorAll('[data-cpv]').forEach(b=>b.onclick=()=>{ const c=b.dataset.cpv; CPART_OUV[c]=!CPART_OUV[c]; render(); });
  document.querySelectorAll('[data-cpc]').forEach(b=>b.onclick=()=>{ const c=parCode(b.dataset.cpc); if(!c) return; try{ navigator.clipboard.writeText(cpartTexte(c)); toast('Message copié.'); }catch(e){ toast(c.code); } });
  document.querySelectorAll('[data-cpw]').forEach(b=>b.onclick=()=>{ const c=parCode(b.dataset.cpw); if(c) window.open('https://wa.me/?text='+encodeURIComponent(cpartTexte(c)),'_blank','noopener'); });
  document.querySelectorAll('[data-cpx]').forEach(b=>b.onclick=()=>{ const code=b.dataset.cpx;
    confirmModal('Arrêter ce code ?', `Le code ${code} ne pourra plus être activé. Les élèves qui l’ont déjà activé gardent leur Premium jusqu’à la fin.`, 'Arrêter', async()=>{ closeModal();
      try{ const {data,error}=await SB.rpc('annuler_code_partage',{p_code:code}); if(error) throw error; audit('Code à partager arrêté', code); await chargerCpart(); render(); toast('Code arrêté.'); }catch(e){ toast(frErr(e)); } }); });
}

function bindCodes(){
  if(MODE!=='supabase') return;
  if(CODES===null){ chargerCodes().then(()=>{ if(page==='paiements') render(); }); return; }
  const cp = t=>{ try{ navigator.clipboard.writeText(t); toast('Copié.'); }catch(e){ toast(t); } };
  document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{ UI.codesF=b.dataset.cf; render(); });
  if($('#creload')) $('#creload').onclick=async()=>{ await chargerCodes(); render(); toast('Codes à jour.'); };
  if($('#cgo')) $('#cgo').onclick=async()=>{ const nb=Math.max(1,Math.min(200,+$('#cnb').value||1)), pl=$('#cplan').value, note=$('#cnote').value.trim(); $('#cgo').disabled=true;
    try{ const {data,error}=await SB.rpc('creer_codes',{p_plan:pl,p_nombre:nb,p_note:note}); if(error) throw error; if(!data||!data.ok) throw new Error('Création refusée ('+(data&&data.raison||'?')+').');
      CODES_NEUFS=data.codes||[]; audit(`${CODES_NEUFS.length} code${CODES_NEUFS.length>1?'s':''} d’activation créé${CODES_NEUFS.length>1?'s':''}`, data.plan+(note?' · '+note:'')); await chargerCodes(); render(); toast(`${CODES_NEUFS.length} code${CODES_NEUFS.length>1?'s':''} créé${CODES_NEUFS.length>1?'s':''}.`);
    }catch(e){ toast(frErr(e)); $('#cgo').disabled=false; } };
  if($('#ccopyall')) $('#ccopyall').onclick=()=>cp(CODES_NEUFS.join('\n'));
  document.querySelectorAll('[data-ccopy]').forEach(b=>b.onclick=()=>cp(b.dataset.ccopy));
  document.querySelectorAll('[data-cwa]').forEach(b=>b.onclick=()=>{ const tel=($('#ctel')||{}).value||''; window.open(waCode(b.dataset.cwa,b.dataset.cplan,tel),'_blank','noopener'); });

  document.querySelectorAll('[data-creact]').forEach(b=>b.onclick=()=>confirmModal('Réactiver ce code ?',`À utiliser si ${b.dataset.celeve||'l’élève'} a changé de téléphone ou effacé son navigateur. Le code ${b.dataset.creact} redevient utilisable une fois ; l’accès Premium de l’ancien téléphone s’arrête. L’élève retape son nom et le même code.`,'Réactiver',async()=>{ closeModal(); try{ const {data,error}=await SB.rpc('reactiver_code',{p_code:b.dataset.creact}); if(error) throw error; if(!data||!data.ok) throw new Error('Code introuvable ou pas encore utilisé.'); audit('Code d’activation réactivé', b.dataset.creact); await chargerCodes(); render(); toast('Code réactivé : l’élève peut le retaper.'); }catch(e){ toast(/function|PGRST|404/.test(String(e&&e.message||e))?'Lancez d’abord supabase/codes/2_sans_compte.sql dans Supabase.':frErr(e)); } }));
  document.querySelectorAll('[data-cann]').forEach(b=>b.onclick=()=>confirmModal('Annuler ce code ?',`Le code ${b.dataset.cann} ne pourra plus être utilisé.`,'Annuler le code',async()=>{ closeModal(); try{ const {error}=await SB.rpc('annuler_code',{p_code:b.dataset.cann}); if(error) throw error; audit('Code d’activation annulé', b.dataset.cann); await chargerCodes(); render(); toast('Code annulé.'); }catch(e){ toast(frErr(e)); } }));
}

const ACC_LABEL = {gratuit:'Gratuit', premium:'Premium', masque:'Masqué'};
function seg(key, withInherit=true){
  const r = DB.access.regles[key]?.acces || (withInherit?'inh':DB.access.defaut);
  const opts = (withInherit?[['inh','Hériter']]:[]).concat([['gratuit','Gratuit'],['premium','Premium'],['masque','Masqué']]);
  return `<div class="seg" role="radiogroup" aria-label="Accès : ${esc(labelOf(key))}">${opts.map(([v,l])=>`<button role="radio" aria-checked="${r===v}" class="${v} ${r===v?'on':''}" data-rule="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
}
function effText(key){
  const e = effective(key);
  const src = {explicite:'', quota:' · offert (quota)', herite:' · hérité', defaut:' · par défaut'}[e.source];
  return `<span class="pill ${e.acces==='gratuit'?'free':e.acces==='premium'?'prem':'hid'}">${ACC_LABEL[e.acces]}</span><span class="muted">${src}</span>`;
}
function accessSummary(){
  const c={gratuit:0,premium:0,masque:0};
  for(const k in NODES){ const t=NODES[k].type; if(t==='sujet'||t==='resumes'||t==='appli') c[effective(k).acces]++; }
  return c;
}

/* ---------- 🎁 Semaine gratuite : tout est ouvert à tous pendant la période choisie ---------- */
const dtLocal = d=>{ if(!d) return ''; const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,16); };
function promoEtat(p){ if(!p||!p.actif) return ['Désactivée','']; const t=Date.now(); if(p.du&&t<new Date(p.du)) return ['Programmée','warn']; if(!p.au||t>new Date(p.au)) return ['Terminée','warn']; return ['En cours','ok']; }
function promoCard(){
  const p = DB.access.promo || {}, [et,cl] = promoEtat(p);
  return `<div class="card" style="margin:14px 0;border:2px solid ${p.actif?'#16a34a':'var(--line)'}"><div class="cardhead"><div class="grow"><h3>🎁 Semaine gratuite <span class="pill ${cl}">${et}</span></h3>
    <p class="sub">Pendant la période choisie, <b>tout est gratuit pour tous les élèves</b> : sujets, questions, réponses et corrections. Les cours masqués restent masqués. Un bandeau l’annonce sur l’accueil de l’appli.</p></div></div>
    <div class="codeform">
      <label class="row" style="gap:8px;align-items:center;flex:0 0 auto"><input type="checkbox" id="prOn" ${p.actif?'checked':''} style="width:22px;height:22px"> <b>Activer</b></label>
      <div><label class="lbl" for="prDu">Du</label><input class="field" id="prDu" type="datetime-local" value="${esc(dtLocal(p.du||new Date()))}"></div>
      <div><label class="lbl" for="prAu">Au</label><input class="field" id="prAu" type="datetime-local" value="${esc(dtLocal(p.au||new Date(Date.now()+7*DAY)))}"></div>
      <div style="flex:1 1 220px"><label class="lbl" for="prT">Titre du bandeau</label><input class="field" id="prT" maxlength="80" value="${esc(p.titre||'🎁 Semaine gratuite')}"></div>
    </div>
    <div style="margin-top:12px"><button class="btn pri" id="prGo">Enregistrer</button> <span class="muted small">Les élèves le voient à la prochaine ouverture de l’appli (au plus 5 minutes).</span></div></div>`;
}
function bindPromo(){
  if(!$('#prGo')) return;
  $('#prGo').onclick=()=>{ const du=new Date($('#prDu').value), au=new Date($('#prAu').value), on=$('#prOn').checked;
    if(on && !(au>du)){ toast('La date de fin doit être après la date de début.'); return; }
    DB.access.promo = {actif:on, du:isNaN(du)?null:du.toISOString(), au:isNaN(au)?null:au.toISOString(), titre:($('#prT').value||'').trim().slice(0,80)};
    DB.access.version++; DB.access.misAJour=new Date().toISOString(); persist();
    audit(on?'Semaine gratuite activée':'Semaine gratuite désactivée', on?`du ${dfr(du)} au ${dfr(au)}`:''); render(); toast(on?'Semaine gratuite enregistrée.':'Semaine gratuite désactivée.'); };
}

function appliquerSujets(L, B){
  const Q = DB.access.questions = DB.access.questions||{}, F = DB.access.fincorr = DB.access.fincorr||{}, G = DB.access.regles, ks = new Set(L.map(x=>x.k));
  if(B.fc==='0'){ new Set(L.map(x=>x.mk)).forEach(mk=>{ if(F[mk]){ delete F[mk]; tousSujets().filter(x=>x.mk===mk && !ks.has(x.k)).forEach(x=>F[x.k]=1); } }); }
  L.forEach(({k})=>{
    if(B.qm==='n') Q[k] = {n:Math.max(0,Math.min(500,parseInt(B.n,10)||0)), mode:'sujet'}; else if(B.qm==='x') delete Q[k];
    if(B.fc==='1') F[k] = 1; else if(B.fc==='0') delete F[k];
    if(B.acc==='inh') delete G[k]; else if(B.acc) G[k] = Object.assign({}, G[k]||{}, {acces:B.acc});
  });
  DB.access.version++; DB.access.misAJour = new Date().toISOString();
  const quoi = [B.qm==='n'?`${parseInt(B.n,10)||0} questions gratuites`:B.qm==='x'?'questions gratuites comme le cours':'', B.fc==='1'?'correction à la fin':B.fc==='0'?'correction immédiate':'', B.acc?(B.acc==='inh'?'accès comme le cours':'accès '+ACC_LABEL[B.acc]):''].filter(Boolean).join(', ');
  audit(`Règle groupée : ${quoi}`, `${L.length} sujet${L.length>1?'s':''}`); return quoi;
}
function bindBulkSuj(){
  const B = bsState(), card = $('#bscard'); if(!card) return;
  card.ontoggle = ()=>{ B.open = card.open; };
  const on = (id, ev, f)=>{ const el = $('#'+id); if(el) el[ev] = f; };
  on('bsqm','onchange',e=>{ B.qm = e.target.value; render(); });
  on('bsn','onchange',e=>{ B.n = Math.max(0,Math.min(500,parseInt(e.target.value,10)||0)); render(); });
  on('bsfc','onchange',e=>{ B.fc = e.target.value; render(); });
  on('bsacc','onchange',e=>{ B.acc = e.target.value; render(); });
  card.querySelectorAll('[data-bsc]').forEach(b=>b.onclick=()=>{ B.cible = b.dataset.bsc; render(); });
  card.querySelectorAll('[data-bso]').forEach(b=>b.onclick=()=>{ const k = b.dataset.bso; B.ouv.has(k)?B.ouv.delete(k):B.ouv.add(k); render(); });
  card.querySelectorAll('[data-bss]').forEach(c=>c.onchange=()=>{ c.checked?B.sel.add(c.dataset.bss):B.sel.delete(c.dataset.bss); render(); });
  card.querySelectorAll('[data-bsm]').forEach(c=>c.onchange=()=>{ const mk = c.dataset.bsm, qq = nrmTxt(B.q.trim()); tousSujets().filter(x=>x.mk===mk && (!qq || nrmTxt(x.m.nom+' '+x.lab).includes(qq))).forEach(x=>c.checked?B.sel.add(x.k):B.sel.delete(x.k)); render(); });
  on('bsnone','onclick',()=>{ B.sel.clear(); render(); });
  const q = $('#bsq'); if(q) q.oninput = ()=>{ const pos = q.selectionStart; B.q = q.value; clearTimeout(q.t); q.t = setTimeout(()=>{ render(); const n = $('#bsq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }, 200); };
  on('bsgo','onclick',()=>{ const L = bsCibles(); if(!L.length) return;
    confirmModal(`Appliquer à ${L.length} sujet${L.length>1?'s':''} ?`, `${[B.qm==='n'?`🎁 ${B.n} premières questions gratuites, le reste Premium`:B.qm==='x'?'🎁 Questions gratuites : comme le cours':'', B.fc==='1'?'📝 Correction à la fin':B.fc==='0'?'📝 Correction immédiate':'', B.acc?'🔐 Accès : '+(B.acc==='inh'?'comme le cours':ACC_LABEL[B.acc]):''].filter(Boolean).join('<br>')}<br><br>Vous pourrez revenir en arrière avec « ↶ Annuler ».`, 'Oui, appliquer', ()=>{ const quoi = appliquerSujets(L, B); closeModal(); toast(`✅ ${L.length} sujet${L.length>1?'s':''} : ${quoi}`); render(); }); });
}

function waDestFmt(n){ n=String(n||''); return n.startsWith('225')&&n.length===13 ? '+225 '+n.slice(3).replace(/(\d{2})(?=\d)/g,'$1 ') : (n?'+'+n:''); }
function waDestCard(){

    <p class="cnote" style="margin:8px 0 0">${off?'Connectez-vous avec le compte administrateur pour régler ce numéro.':WADEST.etat==='erreur'?'⚠️ '+esc(WADEST.msg):WADEST.v?`Les alertes partent vers ${esc(waDestFmt(WADEST.v))}. Ce numéro doit être ajouté dans « À / To » chez Meta (WhatsApp → Configuration de l’API).`:'Vide : la fonction utilise le secret WHATSAPP_DEST de Supabase. Saisissez un numéro (10 chiffres ivoiriens ou avec l’indicatif).'}</p></div>`;
}
async function waDestCharger(){

  catch(e){ WADEST.etat='erreur'; WADEST.msg = /function|schema cache|does not exist/i.test(String(e.message||e)) ? 'Réglage pas encore installé : exécutez signalements/1_signalements.sql dans Supabase (SQL Editor).' : frErr(e); }

async function waDestEnregistrer(v){

    if(!data || !data.ok){ toast(data&&data.raison==='format' ? 'Numéro invalide : 10 chiffres, ou l’indicatif + le numéro.' : 'Réservé à l’administrateur.'); return; }
    WADEST.v = data.numero||''; WADEST.etat=''; audit(WADEST.v?'Numéro WhatsApp des signalements : '+waDestFmt(WADEST.v):'Numéro WhatsApp des signalements effacé','Signalements');
    toast(WADEST.v ? '📲 Signalements envoyés vers '+waDestFmt(WADEST.v) : 'Numéro effacé : retour au secret WHATSAPP_DEST.'); render();
  }catch(e){ WADEST.etat='erreur'; WADEST.msg = /function|schema cache|does not exist/i.test(String(e.message||e)) ? 'Réglage pas encore installé : exécutez signalements/1_signalements.sql dans Supabase (SQL Editor).' : frErr(e); render(); }

function editeurUrl(){ return String(getCfg().editeur || EDITEUR_DEFAUT).trim().replace(/\/?$/,'/'); }
const EDITEUR_DEFAUT = 'https://qidevelloper-cpu.github.io/revision-infas-editeur/';
const PHOTOS = {};   // chemin → lien signé (1 h), pour ne pas le redemander à chaque affichage
async function photoUrl(path){
  if(PHOTOS[path] && PHOTOS[path].t > Date.now()-50*60e3) return PHOTOS[path].u;
  if(MODE!=='supabase' || !SB) return null;
  const {data, error} = await SB.storage.from('signalements').createSignedUrl(path, 3600);
  if(error || !data) return null;
  PHOTOS[path] = {u:data.signedUrl, t:Date.now()}; return data.signedUrl;
}

/* ---------- alertes en direct : nouveaux signalements (toutes les 45 s, tableau de bord ouvert) ---------- */
let SIG_TITRE = document.title, sigNonVus = 0;
function bip(){ try{ const A=new (window.AudioContext||window.webkitAudioContext)(), o=A.createOscillator(), g=A.createGain(); o.connect(g); g.connect(A.destination); o.frequency.value=880; g.gain.setValueAtTime(.0001,A.currentTime); g.gain.exponentialRampToValueAtTime(.25,A.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.5); o.start(); o.stop(A.currentTime+.55); }catch(e){} }
async function veilleSignalements(){
  if(MODE!=='supabase' || !SB || !DB) return;
  try{
    const depuis = DB.reports.reduce((m,r)=>r.date>m?r.date:m, '1970-01-01T00:00:00Z');
    const {data, error} = await SB.from('reports').select('*').gt('created_at', depuis).order('created_at',{ascending:true}).limit(50);
    if(error || !data || !data.length) return;
    const m = MAP.find(x=>x.k==='reports'), neufs = data.filter(r=>!DB.reports.some(x=>x.id===r.id)).map(m.from);
    if(!neufs.length) return;
    neufs.forEach(o=>{ DB.reports.push(o); (SNAP.reports = SNAP.reports || new Map()).set(o.id, JSON.stringify(m.to(o))); });
    sigNonVus += neufs.length; document.title = `(${sigNonVus}) 🚩 ${SIG_TITRE}`;
    const r = neufs[neufs.length-1], t = `🚩 Nouveau signalement · ${matName(r.mat)}`;
    toast(t + (neufs.length>1?` (+${neufs.length-1})`:'')); bip();
    if('Notification' in window && Notification.permission==='granted'){ try{ const n = new Notification(t, {body:String(r.message||'').slice(0,140), tag:'ri-signalement'}); n.onclick=()=>{ window.focus(); go('signalements'); n.close(); }; }catch(e){} }
    if(page==='signalements') render(); else renderNav();
  }catch(e){}
}
setInterval(()=>{ veilleSignalements(); }, 45e3);

function cpBase(){ return (UI.cpSite||'eleves')==='test' ? CP_TEST : portailUrl(); }
function cpLien(code){ return cpBase()+'?compo='+encodeURIComponent(code); }
async function cpCatalogue(){ const b=cpBase(); if(CP_CAT[b]) return CP_CAT[b];
  try{ const r=await fetch(b+'catalogue.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error(r.status); const c=await r.json();
    const L=[]; (c.rubriques||[]).forEach(rb=>(rb.matieres||[]).forEach(m=>{ const S=Array.isArray(m.sujets)?m.sujets.map((x,k)=>({k,t:x[0],n:x[1]})):Array.from({length:m.nsuj||0},(x,k)=>({k,t:'',n:0})); if(S.some(s=>s.n>0||!s.t)) L.push({rub:prettyRub(rb.nom), id:m.id, nom:m.court||m.nom, titres:Array.isArray(m.sujets), sujets:S}); }));
    CP_CAT[b]={ok:true, L}; }catch(e){ CP_CAT[b]={ok:false, L:[], err:'catalogue.json illisible sur '+b}; }
  return CP_CAT[b]; }
async function chargerCompos(){ if(MODE!=='supabase'||!SB){ CPS=null; return; } try{ const {data,error}=await SB.rpc('compo_lister'); if(error) throw error; CPS=data||[]; CP_ERR=''; }catch(e){ CPS=[]; CP_ERR=/function|PGRST|404/.test(String(e&&e.message||e))?'Lancez d’abord supabase/compos/1_compos.sql dans Supabase (SQL Editor → Run).':frErr(e); } }
function cpNomCours(mid){ const c=CP_CAT[cpBase()]; const m=c&&c.L.find(x=>x.id===mid); return m?m.nom:mid; }
function cpTexte(c){ const dl=c.date_limite?`\n📅 DATE LIMITE de la composition : ${dfr(c.date_limite,{weekday:'long',day:'numeric',month:'long'})} à ${hfr(c.date_limite)}`:'';

function cpEtat(c){ if(!c.actif) return ['Close','bad']; if(c.date_limite&&new Date(c.date_limite)<new Date()) return ['Terminée','bad']; return ['Ouverte','ok']; }
const cpDuree = s=>s==null?'—':(s>=60?Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s':s+' s');

/* sujets classés comme dans l'appli : matière (ou « J · matière ») puis antenne · année */
function cpOptions(m,f){ const L=m.sujets.filter(s=>s.n>0||!s.t), opt=(s,t)=>`<option value="${s.k}" ${+f.k===s.k?'selected':''}>${esc(t)}${s.n?' · '+s.n+' q.':''}</option>`;
  const grp=s=>{ const p=String(s.t||'').split(' · '); if(p.length<2) return null; return p[0]==='J'&&p.length>2?['🎓 Préparation au D.E (J) · '+p[1], p.slice(2).join(' · ')]:[p[0], p.slice(1).join(' · ')]; };
  if(L.filter(grp).length<L.length/2) return L.map(s=>opt(s,s.t||'Sujet '+(s.k+1))).join('');
  const G=new Map(); L.forEach(s=>{ const g=grp(s)||['Autres',s.t||'Sujet '+(s.k+1)]; if(!G.has(g[0])) G.set(g[0],[]); G.get(g[0]).push([s,g[1]]); });
  return [...G].map(([g,xs])=>`<optgroup label="${esc(g)}">${xs.sort((a,b)=>a[1].localeCompare(b[1],'fr')).map(([s,t])=>opt(s,t)).join('')}</optgroup>`).join(''); }
